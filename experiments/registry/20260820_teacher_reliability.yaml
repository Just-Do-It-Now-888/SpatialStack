issues:
  - id: ISSUE-T01
    at: "2026-08-20T23:20:00+08:00"
    symptom: "断点续跑按 sample_id 去重会静默丢样本"
    evidence: "main_train.parquet 124,306 行只有 123,645 个不同的 sample_id，661 条重名"
    root_cause: "同一道 SPAR 题在两个视角子集下各写了一行，sample_id 不含子集"
    solution: "teacher_eval_core.done_ids 改用 row_index（构造时按 parquet 行号赋值，天然唯一）"
    status: resolved
    prevention: "任何按 id 去重的续跑逻辑先验证该 id 在源数据里唯一"

  - id: ISSUE-T02
    at: "2026-08-21T00:30:00+08:00"
    symptom: "句末数字读不出：'Therefore, the count of pipes is 0.' 解析为 None，记成「无法判读」"
    evidence: >
      冒烟 600 条里 4 条 obj_count 落到 judge 队列，逐条 debug 发现
      extract_vsibench_number 返回 None，而回答末行明明有数字。
    root_cause: >
      scripts/opsd/vsibench_scoring.py 的 _NUMBER_RE 尾部前瞻是 `(?![\d.])`，
      本意是挡住 "1.2.3"，但同时把任何**句末**数字（后面跟句号）也挡掉了。
      主路径 _ANSWER_NUMBER_RE 无此前瞻，所以只在兜底路径暴露，此前一直没被发现。
    solution: "前瞻改为 `(?!\\d)(?!\\.\\d)`：仍拒绝版本号形式，但接受句末数字"
    status: resolved
    impact: >
      影响面是 VSI-Bench 数值题里「没有 answer/distance 等关键词、且数字在句末」的回答。
      只会把 answered 从 0 改成 1，不会把已判读的行改判，因此历史分数只可能被低估。
      已回归 test_lmms_vsibench_protocol / test_vsibench_in_training / test_lmms_cvbench_protocol，均通过。
    prevention: "正则前瞻若同时承担「拒绝格式 A」与「界定边界」，分开写并各配一条测试"

  - id: ISSUE-T04
    at: "2026-08-21T01:20:00+08:00"
    symptom: "spar32 扫描集 2,000 道题只聚出 1,988 个 sweep_group"
    evidence: >
      plan.jsonl 里 674 个 sample_id 各指两道**不同**的题（逐条比对 body，
      0/674 文本相同）：id 是 scene+index，跨题型会撞。
      例：spar32/abf29d2474_18 一条是 room_size，另一条是 spatial_imagination。
    root_cause: "sweep_group 直接用了 sample_id，与 ISSUE-T01 同源"
    solution: "sweep_group 改为 sample_id#plan_position，并在 builder 里断言组数==题数"
    status: resolved
    prevention: >
      同一个不唯一的 id 已经咬了两次（续跑去重、扫描分组）。
      凡是拿 id 做「同一个东西」的依据，先断言唯一性，且把断言写进构造脚本本身。

  - id: ISSUE-T03
    at: "2026-08-21T00:50:00+08:00"
    symptom: "SPAR 数值题金标解析出 50、169 这种物体编号"
    evidence: >
      「金标当回答喂回去必须满分」的自洽测试报出 3,007 条不匹配，
      集中在 distance/depth 三个题型，例如
      "At a depth of about 6.7 meters, Object169's center is referenced here." 金标读成 169。
    root_cause: "金标侧取的是字符串里第一个数字，而这些模板把物体 id 写在测量值前后"
    solution: "金标与回答两侧都改为优先取带单位的数字（`X meters` / `X square meters`），obj_count 除外"
    status: resolved
    prevention: "金标解析器必须过自洽测试；这条测试原本因为两侧犯同一个错而假通过"

  - id: ISSUE-T05
    at: "2026-08-21T02:20:00+08:00"
    symptom: "方向题分数低到没法解释：spatial_imagination_oo_video 全匹配准确率 0.9%，低于三轴瞎猜的 12.5%"
    evidence: >
      中期 55,665 条上，该题型 answered 54.7%、acc|ans 1.64%。
      三条轴（左右/上下/远近）独立二选一，瞎猜也该有 1/8。
    root_cause: >
      不是 bug，是指标把两件事混在一起了。方向题按「金标提到的每条轴都要对」全匹配计分，
      于是「说了 above，但金标是 left+above+farther」和「说了 right，金标是 left」同样得 0。
      teacher 的实际行为是只挑一条轴回答，所以分数被不完整性主导，掩盖了它的方向感本身。
    solution: >
      teacher_scoring.aggregate 增加两个分解列并在 score_teacher_dump 里单出一张表：
      direction_complete_pct（答全了金标所有轴的比例）与
      direction_axis_acc（在它主动说出口的轴上的微平均准确率）。
      全匹配分数保留为主指标不变，分解列只用于解释。
    status: resolved
    impact: >
      不改任何分数，只是让「答得不全」与「答得不对」在报告里可分。
      按此看：oo_video 完整率 2.8% / 轴准确率 67.3%，oo_video_hard 2.9% / 69.0%，
      oc_video 35.7% / 53.9%，obj_spatial_relation_oc_mv 32.9% / 73.9%。
      （全量最终数字见 evaluation.results.direction_decomposed。）
    prevention: "全匹配（all-of-K）指标一旦逼近或低于随机水平，先分解成「覆盖率 × 单项准确率」再下结论"

  - id: ISSUE-T06
    at: "2026-08-21T10:40:00+08:00"
    symptom: "数值题回答被读成负数：obj_count 解析出 -4 / -21 / -24，全部记 0 分"
    evidence: >
      spar32 扫描的反向抽查分歧率 8.6%（as_trained 只有 1.8%），26 条全在 numeric。
      逐条调出原始回答：金标「2 clothes」，回答结尾是
      "In Frame-4, there is another pile ... there are two distinct piles"，
      规则层 parsed_repr = '-4'。
      按 parsed_repr 以 '-' 开头统计：spar32 扫描 967/9,580 = 10.1% 的数值题中招，
      as_trained 388/30,991 = 1.25%，且这些行**无一例外得 0 分**。
    root_cause: >
      vsibench_scoring._NUMBER_RE 的后顾只有 `(?<![\d.])`，不挡字母。
      多视角 prompt 把每张图标成 Frame-0..Frame-N，teacher 讲解时频繁引用这些标签，
      而兜底路径取「最后一行的最后一个数字」——于是 "Frame-4" 里的连字符被当成负号。
      spar32 中招率远高于 vlm3r，是因为 32 图的回答几乎必然逐帧点名。
    solution: >
      后顾改为 `(?<![\w.])(?<!\w-)`：前者挡住 scene0555_00 这类标识符，
      后者专门挡住「连字符粘在词后面」的帧标签。真负数（"-3.5 metres"）仍可解析。
      修好后这些行落回词形数字兜底（"two" → 2），大多能正确判读。
    status: resolved
    impact: >
      只会把错判的 0 分改成正确判读，不会把已对的行改错，所以历史分数是**低估**。
      spar32 扫描曲线整体上移，as_trained 影响约 1.25% 的数值题。
      已回归 test_lmms_vsibench_protocol / test_vsibench_in_training /
      test_lmms_cvbench_protocol（11 条）与 SPAR 37 条，全通过。
    prevention: >
      判分正则要拿**真实回答文本**里的高频干扰串做测试，不能只测理想答案。
      "Frame-N" 是 prompt 自己引入的，属于必测干扰项。

  - id: ISSUE-T07
    at: "2026-08-21T10:50:00+08:00"
    symptom: "修好 T06 后自洽测试立刻报 1 条：金标「2 rj45 outlet」被读成 45"
    evidence: "test_gold_scores_itself 报 obj_count/numeric 1 条不匹配；金标解析 45，回答侧解析 2"
    root_cause: >
      spar_scoring.py 自己又定义了一份 `_NUMBER_RE = r"-?\d+(?:\.\d+)?"` 供金标侧使用，
      完全没有后顾。T06 只修了 vsibench_scoring 那一份，于是两侧读法分叉，
      金标侧仍会从 "rj45" 里读出 45（它同样会从 "Frame-4" 读出 -4）。
    solution: "删掉本地副本，金标侧改为 `from vsibench_scoring import _NUMBER_RE`，全仓一份定义"
    status: resolved
    impact: >
      这条恰好被自洽测试当场抓住——正是 LESSON-021 预警过的「两侧各写一套正则迟早分叉」。
      在修一个解析 bug 的过程中立刻复现了同一类错误，说明该测试值得常驻。
    prevention: "同一个语义的解析器全仓只允许一份定义；修解析 bug 后必须重跑自洽测试"

