experiment_id: 20260820_teacher_reliability
title: "MV-OPSD teacher 可靠性：Qwen3.5-4B 在 3~32 视角下对训练问题的正确率"
status: completed  # planned | running | completed | failed | cancelled

created_at: "2026-08-20T23:40:00+08:00"
finished_at: "2026-08-21T11:10:00+08:00"
owner: "cursor-window-mvopsd"

goal: >
  自蒸馏把 teacher 的 N 视角后验拷给 student，但训练回路从未检查过这个后验是否正确：
  vopd_loss 度量的是「student 与 teacher 是否一致」，不是「teacher 是否答对」
  （LESSON-012）。本实验补上这次测量——用 rollout8 训练时 teacher 的真实输入
  （teacher_prompt + 全部 N 张视角）让冻结的基座 Qwen3.5-4B 直接作答，统计其正确率，
  并按 teacher 视角数 N 分组。

  这是解释 LESSON-020（CV-Bench 最优 checkpoint 在 VSI-Bench 上崩 19 分）的一条
  候选路径：如果 teacher 本身在训练分布上就答不对、且回答形态是长散文，
  那么「student 学会了 teacher」与「student 在下游变差」并不矛盾。

hypothesis: >
  待检验，不预设方向。两个可分离的问题：
  (a) 准确率——teacher 在训练问题上的正确率是多少，是否随视角数上升；
  (b) 回答形态——teacher 是否直接作答。冒烟已观察到中位输出 215 token 的长散文
  （见 findings.response_form），这一项本身就可能是 student 形态漂移的来源。

relations:
  explains: 20260818_qwen35base_mvopsd_v1_rollout8
  note: >
    视角数取值由 rollout8 实际训练数据决定（data/mvopsd/parquet/main_train.parquet
    的 extra_info.n_views_teacher），不是自选的扫描点。

design:
  arm_as_trained:
    what: "按训练实际 N 出表"
    data: "data/mvopsd/parquet/main_train.parquet，全量 124,306 条"
    teacher_views: "逐行 n_views_teacher，即该样本全部视角"
    n_distribution:
      "3": 33970    # spar_3view 全部
      "4": 351
      "5": 1531
      "6": 3805
      "7": 1429
      "8": 62695    # llava_hound 30,620 + vlm3r 30,340 + vsi_appr_order 1,735
      "32": 20525   # spar_32view 全部
    view_instances: 1302162
    confound: >
      **N 与数据源几乎一一绑定**：N=3 只可能是 spar_3view，N=32 只可能是 spar_32view，
      N=4~8 只可能是 llava_hound / vlm3r / vsi_appr_order。因此本 arm 的
      「准确率 vs N」曲线读到的是数据源差异，**不得**表述为视角数的效应。
      要分离必须看下面两条受控扫描。
  arm_sweep:
    what: "受控视角扫描：同一道题、同一相册，只改 teacher 看到的张数"
    builder: scripts/opsd/build_teacher_view_sweep.py
    view_selection: >
      每个预算下取**全相册均匀间隔**的视角（np.linspace），不是嵌套随机抽取。
      理由：4/32 的预算应当拿到「最好的 4 视角视图」，这也是本项目其他帧预算评测的
      做法（vsibench_eval_core.sample_frames）。嵌套随机会拿一个好的 32 视角相册去比
      一个差的 4 视角相册，把采样质量差异记成视角数效应。
    pool_constraint: >
      只用 required_views 为空（问题不引用任何 Frame-N）的样本，否则截断相册会留下
      悬空帧引用，静默改变题意。
    arms:
      vlm3r:
        source: vlm3r_scannet
        album_views: 8
        budgets: [1, 2, 3, 4, 5, 6, 7, 8]
        questions: 2500
        rows: 20000
        rationale: "选择题，规则可判分，无解析器风险，给一条干净的曲线"
      spar32:
        source: spar_32view
        album_views: 32
        budgets: [1, 2, 3, 4, 6, 8, 12, 16, 24, 32]
        question_types: [obj_count, room_size, spatial_imagination_oc_video_hard, spatial_imagination_oo_video_hard]
        per_type: 500
        questions: 2000
        rows: 20000
        rationale: "唯一能到 32 视角的源；四个题型两数值两方位，按题型均衡抽样"

protocol:
  fidelity: >
    prompt 完全复刻 ray_trainer._build_teacher_prompt_inputs，而不是任何 benchmark harness：
  details:
    - "messages 直接取 parquet 的 teacher_prompt 列，因此**没有 system 轮**。
       VSI-Bench 会加 'You are a helpful assistant.'，且该轮值约 1 分（ISSUE-203），
       但 teacher 从未见过它，加上去就变成在测一个训练没用过的模型。"
    - "enable_thinking=False，来自 data.apply_chat_template_kwargs。"
    - "图像按缓存原尺寸交给 processor，**不设** min_pixels/max_pixels。
       缓存已是 patch 对齐的 512x384（192 visual token/张），
       preprocessor_config 的 [65536, 16777216] 像素区间不会触发缩放，
       训练不做 resize，离线也不能做。"
    - "max_tokens 1024 = data.max_response_length；greedy（temperature 0）。"
    - "max_model_len 12288 = self_distillation.max_reprompt_len。"
  code:
    core: scripts/opsd/teacher_eval_core.py
    entry: scripts/opsd/tools/run_teacher_reliability.py
    driver: scripts/opsd/run_teacher_reliability.sh
    sweep_builder: scripts/opsd/build_teacher_view_sweep.py

scoring:
  decision: "用户 2026-08-20 决定：SPAR 解析器 + gpt-oss-120b judge 判 llava_hound，覆盖 100%"
  coverage_problem: >
    现有训练打分函数 _mvopsd_score（scripts/opsd/mvopsd_reward.py:110）只认单字母选项与
    纯数字，全量 124,306 条里只有 37,471 条（30.1%）可判分：
    vlm3r_scannet 30,567（100%）、vsi_appr_order 1,735（100%）、
    spar_3view 3,881（11.4%）、spar_32view 1,288（6.3%）、llava_hound 0。
    直接跑会得到「N=3 与 N=32 准确率都接近 0」的假象。
  code:
    spar_parser: scripts/opsd/spar_scoring.py
    router: scripts/opsd/teacher_scoring.py
    rule_tier: scripts/opsd/tools/score_teacher_dump.py
    judge_tier: scripts/opsd/tools/judge_teacher_dump.py
    judge_driver: scripts/opsd/run_teacher_judging.sh
    tests: [scripts/opsd/tests/test_spar_scoring.py, scripts/opsd/tests/test_teacher_scoring.py]
  spar_families:
    numeric: "depth / distance / obj_count / room_size，用 MRA:.5:.95:.05，与 VSI-Bench 数值题同尺"
    direction: "left|right、above|below、（仅 oo 题）closer|farther 三条独立轴"
    compare_pair: "distance_infer_center_oo_mv：green / blue 哪个点"
    compare_set: "distance_infer_center_oo_video：哪个 ObjectN 最近/最远"
    bev: "spatial_imagination_map_mv：坐标表，单独一行上报，**不并入**主准确率（0.5m 容差是我们定的，不是 SPAR 的口径）"
  deliberate_exclusions:
    - "方位题丢弃 front/behind 从句：它说的是观察者在哪，不是答案，且同一条金标常两个词都出现。"
    - "*_imagination_*_mv 金标同时描述移动前后，题面只问移动后；朴素扫描歧义时从最后一个
       move 标记重读，仍歧义则记为金标读不出并**移出分母**，不按硬币正反判。"
    - "方位题只答一半（金标 left below，模型只说 below）计为 answered=1 / score=0，
       即「答错」而非「读不出」；只有一条轴都读不出才送 judge。"
  judge_protocol:
    mode: >
      有结构化答案的一律让 judge 做**抽取**（数字 / 选项字母 / 三轴方位 / 候选名），
      评分仍由本项目指标完成。Yes/No verdict 会把 MRA 压成二值，并用 judge 自己的
      标准替代基准的标准——Vision-OPD 的级联就是这么推翻了约 10% 规则已判对的行（LESSON-019）。
      抽取 prompt **不给 judge 看金标**，否则它会开始报告正确答案而不是模型说了什么。
    semantic_exception: "llava_hound 是开放描述，没有可抽取的目标，只能语义 verdict"
    reverse_audit: "规则已读出的行按 2% 抽样重新交给 judge 抽取，报告分歧率与分歧题型"
    calibration_probe: >
      语义层无规则层可对照，改为自检：把金标当作回答喂进去（应答 Yes）、
      把另一条样本的金标喂进去（应答 No），两个错误率与分数并列上报。
    never_lowers: "只重判规则层弃权的行，judge 能抬分不能压分；rule-only 数值并列保留"
  separation: "answered 与 score 分开上报；解析失败绝不折叠成 0 分（LESSON-018）"
  gold_coverage_measured: "SPAR 金标 54,488 / 54,495 = 99.99% 可解析（剩 7 条 obj_spatial_relation_oo_mv 自相矛盾）"
  self_consistency_test: >
    把每条金标当作模型回答喂回去必须得 1.0 分，49,550 条全通过。
    这条测试抓到了三个真 bug：金标数值取了首个数字（把 "Object50 ... 0.8 meters" 读成 50）、
    方位题读回答时没做移动前后消歧、以及下面的 vsibench_scoring 句末数字 bug。

findings:
  response_form:
    measured_at: "2026-08-20T23:20:00+08:00"
    source: "600 条随机冒烟，logs/eval/teacher_reliability/_smoke/"
    observation: >
      **teacher 不直接作答。** 中位输出 215 token、最大 1024、1 条截断。
      连 vlm3r_scannet 这种 prompt 末尾明写
      "Answer with the option's letter from the given choices directly." 的选择题，
      teacher 也会先写一大段分析。对照：同一基座在 VSI-Bench 上（带 system 轮、
      lmms_eval 题面）中位输出只有 4 token。
    why_it_matters: >
      待核对，但方向明确：student 被蒸馏的正是这个长散文后验。
      LESSON-020 记录的 student 退化形态（中位输出从 4 token 跳到 168~205 token、
      滑入重复枚举）与 teacher 的形态同向。若最终数据坐实，
      「训练把模型改成写长推理」的源头就是 teacher 本身，而不是优化超参。
    caveat: "600 条冒烟，仅用于确认链路与形态，不作为准确率结论。"

evaluation:
  status: done
  throughput: "11.3 行/秒实测（8 卡 TP=8）"
  actual_wall: "as_trained 3.06h（124,306 行）；sweep_vlm3r 8.1min；sweep_spar32 16.7min；judge 层 20min"
  artifacts:
    root: logs/eval/teacher_reliability/
    as_trained: logs/eval/teacher_reliability/as_trained/generations.jsonl
    sweep_vlm3r: logs/eval/teacher_reliability/sweep_vlm3r/generations.jsonl
    sweep_spar32: logs/eval/teacher_reliability/sweep_spar32/generations.jsonl
    status: logs/eval/teacher_reliability/status.txt
    scored: "各目录下 scored_judged.jsonl + summary.json（summary_prefix.json 是 ISSUE-T06 修复前的旧版，留作对比）"
    report: experiments/reports/汇报_20260821_评估Teacher监督可靠性与视角收益.md

  results:
    headline: >
      teacher 在训练池上整体正确率 41.4%（124,306 条，作答率 97.6%），
      但题型间跨度达 40 倍：llava_hound 描述题 57.7%，
      spar_32view 物-物空间想象题只有 1.3%。
      受控扫描显示视角收益明显边际递减：vlm3r 在 5 视角后趋于饱和，
      spar32 在 16 视角后趋缓；8→32 视角的额外收益与新增计算成本不成比例。

    # N 与数据源几乎一一绑定，这张表不能读成视角效应。
    by_n_views_confounded:
      3:  {rows: 33970, acc: 33.35, answered_pct: 94.9, source: spar_3view}
      4:  {rows: 351,   acc: 47.81, answered_pct: 98.0, source: llava_hound}
      5:  {rows: 1531,  acc: 59.80, answered_pct: 100.0, source: llava_hound}
      6:  {rows: 3805,  acc: 58.89, answered_pct: 100.0, source: llava_hound}
      7:  {rows: 1429,  acc: 58.84, answered_pct: 99.9, source: llava_hound}
      8:  {rows: 62695, acc: 50.88, answered_pct: 99.1, source: "vlm3r + llava_hound"}
      32: {rows: 20525, acc: 19.91, answered_pct: 96.8, source: spar_32view}

    by_source:
      llava_hound_64k: {rows: 37509, acc: 57.72}
      vsi_appr_order:  {rows: 1735,  acc: 55.27}
      vlm3r_scannet:   {rows: 30567, acc: 44.02}
      spar_3view:      {rows: 33970, acc: 33.35}
      spar_32view:     {rows: 20525, acc: 19.91}

    by_family:
      freeform:     {rows: 37509, acc: 57.72}
      yesno:        {rows: 360,   acc: 62.22}
      compare_pair: {rows: 4585,  acc: 56.21}
      mcq:          {rows: 26467, acc: 45.97}
      numeric:      {rows: 30991, acc: 39.06}
      compare_set:  {rows: 1260,  acc: 33.81}
      direction:    {rows: 20698, acc: 10.54}
      bev:          {rows: 2436,  acc: 6.10}

    worst_and_best_question_types:
      best:
        - {type: "llava_hound 描述题", rows: 37509, acc: 57.72}
        - {type: "spar_3view/distance_infer_center_oo_mv", rows: 4985, acc: 57.01}
        - {type: "vsi_appr_order/appearance_order", rows: 1735, acc: 55.27}
      worst:
        - {type: "spar_32view/spatial_imagination_oo_video", rows: 3162, acc: 1.30}
        - {type: "spar_32view/spatial_imagination_oo_video_hard", rows: 2568, acc: 1.52}
        - {type: "spar_3view/spatial_imagination_map_mv (BEV)", rows: 2436, acc: 6.10}

    # 见 ISSUE-T05：全匹配分数被「答得不全」主导，方向感本身并不差。
    direction_decomposed:
      note: "complete_pct = 答全金标所有轴的比例；axis_acc = 在它主动说出口的轴上的微平均准确率"
      spar_32view/spatial_imagination_oo_video:      {complete_pct: 2.9,  axis_acc: 68.2, exact: 1.6}
      spar_32view/spatial_imagination_oo_video_hard: {complete_pct: 2.8,  axis_acc: 69.1, exact: 2.1}
      spar_32view/spatial_imagination_oc_video:      {complete_pct: 36.2, axis_acc: 55.3, exact: 17.7}
      spar_3view/obj_spatial_relation_oc_mv:         {complete_pct: 32.6, axis_acc: 73.0, exact: 24.9}
      spar_3view/obj_spatial_relation_oo_mv:         {complete_pct: 9.5,  axis_acc: 73.6, exact: 17.4}
      spar_3view/spatial_imagination_oc_mv:          {complete_pct: 30.2, axis_acc: 51.1, exact: 14.8}

    # 固定题目、只变视角数，视角在整段相册上均匀取样。这才是视角效应。
    sweep_vlm3r:
      design: "2,500 道 vlm3r_scannet 题 × 8 个预算 = 20,000 行"
      curve: {1: 33.03, 2: 35.50, 3: 36.89, 4: 39.53, 5: 42.08, 6: 41.20, 7: 42.27, 8: 41.35}
      conclusion: "1→5 涨 9.1 个点；5 张之后完全饱和（5/6/7/8 在 41.2-42.3 之间无趋势抖动）"

    sweep_spar32:
      design: "2,000 道帧无关（required_views==0）spar_32view 题 × 10 个预算 = 20,000 行"
      curve: {1: 11.93, 2: 12.84, 3: 13.04, 4: 14.94, 6: 16.50, 8: 18.43, 12: 19.80, 16: 20.70, 24: 20.48, 32: 21.95}
      conclusion: >
        1→32 一共只涨 10.0 个点，16 张之后基本走平（16/24/32 在 20.5-22.0）。
        即使给到 32 张图绝对正确率仍不到 22%，说明瓶颈不在信息量而在推理能力。

    scoring_confidence:
      rule_tier_share: "规则层独立判掉 62.9%（78,177/124,306）"
      judge_read: "46,129 条队列读出 43,977 条；剩余 2,152 条是真正没给答案的回答，计 0 分"
      reverse_audit:
        as_trained: "3.11%（12/386）"
        sweep_vlm3r: "0.51%（2/391）"
        sweep_spar32: "3.28%（10/305），其中材质性分歧（gap>0.25）仅 1.97%"
        adjudicated: >
          人工逐条复核了 as_trained 全部 12 条分歧，**规则层对、judge 错**：
          MCQ 上回答末尾明确写着 C、规则层读出 C，judge 却报 B（它在自己答题而非抽取）；
          方向题上 judge 会把回答根本没说的轴补全。
          所以该数字是分歧率的**上界**，不是规则层错误率。
      semantic_calibration: "金标当回答喂回去 100 条零误判；无关 caption 100 条仅 1 条误接受"
      judge_not_inflating: >
        方向题上 judge 补判行准确率 8.11%，低于规则层判的 12.18%
        （spar32 扫描 3.68% vs 9.62%）——judge 接手的是更含糊的回答，整体无系统性抬分。

    recommendations:
      - >
        采用“8 视角基础预算 + 按需补充”：vlm3r 在 5 视角后趋于饱和，
        spar32 在 16 视角后增益趋缓。
        但 spar32 受控扫描仅覆盖不引用特定帧的题目，因此不能把所有 32 视角样本无条件截断为 8；
        对题面明确依赖特定帧的样本应至少保留所需视角。
      - >
        spatial_imagination_oo_*（5,730 条）当前不适合直接蒸馏：1.3-1.5% 不是能力问题而是格式问题
        （teacher 只答一条轴，单轴准确率 68%）。要么改 prompt 强制三轴齐出，要么从蒸馏目标里摘掉。
      - "按题型给蒸馏样本加权：可靠性跨度 57.7%→1.3%，统一对待等于让错误信号与正确信号同权进入训练"

