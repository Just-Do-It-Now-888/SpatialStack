    gpus_free: "8 卡，0 MiB 占用，无残留 ray/vllm 进程"
    disk_free: "3.3T"
    checkpoint_dir_empty: true
    train_file_rows: 30567
    val_file_rows: 5130
    env_cleaned: >
      启动 shell 里 CONDA_DEFAULT_ENV=base、CONDA_PREFIX=/home/c30084464/miniconda3，
      因此必须清（ISSUE-501）。清后 /usr/bin/python3 可见 vllm / verl / torch / transformers。
    override_types_checked: >
      hydra compose 后 vsibench_boxed_primary=True(bool)、trust_boxed=True(bool)、
      teacher_enable_thinking=False(bool)、judge.mode=extract
    checkpoint_size: "冒烟实测单个 checkpoint 54 GB；19 个约 1.0 TB，余量 3.3 T 足够（max_actor_ckpt_to_keep=null 全保留）"
  command: |
    env -u PYTHONNOUSERSITE -u CONDA_PREFIX -u CONDA_DEFAULT_ENV -u CONDA_SHLVL \
        -u CONDA_PYTHON_EXE PATH=/usr/bin:/usr/local/bin:/bin \
      EXPERIMENT_NAME=20260826_mvopsd_vlm3r_epoch1_boxed_sample \
      TRAIN_FILE=$PWD/data/mvopsd/parquet_single_vlm3r_scannet/main_train.parquet \
      VAL_FILE=$PWD/data/eval/vsibench_verl/vsibench_val_boxed.parquet \
      TOTAL_STEPS=477 TEST_FREQ=25 \
      VAL_DO_SAMPLE=1 VAL_TEMPERATURE=1.0 VAL_TOP_P=0.8 VAL_N=1 \
      bash scripts/opsd/run_mvopsd.sh main
  path_note: >
    PATH 前置 /usr/bin 且清 conda 变量是必须的（ISSUE-304 + ISSUE-501）：训练环境是
    系统 python3.12 + ~/.local，conda 的 PYTHONNOUSERSITE=1 会让 python 看不见 ~/.local 里的 vllm。
  outputs:
    train_log: logs/train/20260826_mvopsd_vlm3r_epoch1_boxed_sample/
    val_dump: logs/val/20260826_mvopsd_vlm3r_epoch1_boxed_sample/
    rollouts: rollouts/20260826_mvopsd_vlm3r_epoch1_boxed_sample/
    checkpoint: checkpoints/20260826_mvopsd_vlm3r_epoch1_boxed_sample/
  wandb: "slcheng/MV-OPSD，run 名即 experiment_name"

wall_clock_estimate: >
  训练 477 步 × 约 33 s/步（20260824 实测 timing_s/step=33.0）= 约 4.4 h。
  评测 20 点（step 0 + 每 25 步）：生成约 35 min/点（plain 在训练内实测 29.5 min；
  boxed 解码量是 plain 的 3.7 倍——mean 356 vs 97 token——但 32 帧 prefill 主导，
  离线 boxed 全量实测约 21 min vs plain 同批次，所以按 +20% 估而不是 +270%），
  judge 因 trust_boxed 只判约 8% 的行，约 1~2 min/点，合计约 37 min/点 = 约 12.3 h。
  总计约 **16.7 h**，另加 vLLM 起引擎与 judge 预热约 15 min。评测占约 74% 墙钟。
  存盘 19 个 checkpoint，需确认磁盘余量。

do_not: >
  不要把本轮任何数字与 53.6 带并列——prompt 与解码都变了，见 comparability；
  不要在本轮结果出来前改 val parquet 或判分链（改了曲线前后段就不同口径）；
  不要因为 step 0 比历史低 6~11 分就判定模型退化，那是协议位移，已在 anchors 里拆开量化。

