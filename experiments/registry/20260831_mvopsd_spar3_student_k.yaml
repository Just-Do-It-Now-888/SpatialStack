    wandb: https://wandb.ai/slcheng/MV-OPSD/runs/uqawyz9q
  k2:
    best_step: 15
    step0_acc: 0.4765
    best_acc: 0.4802
    final_step: 63
    final_acc: 0.4608
    delta_vs_step0_pp: 0.37
    checkpoint: "FSDP 已删（2026-09-07 node-B）；可用 output/20260831_mvopsd_spar3_k2_epoch1_nothink_global_step_15_hf"
    wandb: https://wandb.ai/slcheng/MV-OPSD/runs/e4u79rpi
  conclusion: >
    K=1 相对 step 0 提升明显（+2.96 pp），K=2 几乎走平（+0.37 pp）且末步低于 step 0。
    增加 student 视角数未带来收益；问题不在 student K 本身。

