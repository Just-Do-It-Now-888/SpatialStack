issues:
  - id: ISSUE-001
    at: "2026-09-02T05:20:00+08:00"
    symptom: >
      TOTAL_STEPS=200，进度条 63/200，但 epoch 0 扫完即干净退出；8 卡空闲。
    evidence: >
      训练日志末尾 Training Progress 63/200 后 wandb sync；val dump 只到 60.jsonl；
      latest_checkpointed_iteration=60。step 0–60 overall：47.80 / 47.38 / 47.53 /
      47.48 / 46.89 / 47.72 / 47.59。
    root_cause: >
      ray_trainer 外层 for epoch in range(total_epochs)，mvopsd.yaml 默认
      total_epochs=1。total_training_steps 只改进度条和 is_last_step，不延长循环。
      4,064/64=63 步即 1 epoch。见 LESSON-032。
    solution: >
      从 checkpoints/.../global_step_60 resume_mode=auto；显式
      trainer.total_epochs=4（4×63>200），val_before_train=False。
    status: mitigated
    prevention: >
      步数超过 ceil(n_train/batch) 时必须同时提高 total_epochs。

