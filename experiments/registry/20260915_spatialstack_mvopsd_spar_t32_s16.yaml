finished_at: null
owner: cursor-window-spatialstack

goal: >
  在 SpatialStack geo 权重上，对 SPAR 全量（spar_3view + spar_32view）跑 1 epoch
  MV-OPSD。32-view 题 Teacher 看满 32 帧、Student 看 16 帧且必含 oracle 关键帧；
  3-view 题相册不够，Teacher=3 / Student=3。正式训练 wandb online 记曲线。

hypothesis: >
  spar32 上 Teacher 全相册正确率与关键帧接近（20260914 Δ −0.62pp），Student 16
  帧钉住关键帧后应保留 32→K 的特权间隙。合池约 62% 为 3-view 且 N/K=1，整体
  VSI 曲线会被稀释；32-view 子集才回答本假设。

relations:
  init_from: 20260909_spatialstack_qwen35_geo
  follows:
    - 20260914_teacher_keyframe_probe
    - 20260914_teacher_key_plus_probe
    - 20260829_mvopsd_spar_all_epoch1_nothink
  engine: hf_generate

code:
  git_commit: null
  git_dirty: null

environment:
  conda_env: sr_opsd
  nodes: [node-A]
  gpus_per_node: 8
  gpu_type: H20

model:
  backbone: Qwen3.5-4B + VGGT geometry fusion
  model_path: output/spatialstack_qwen35_train
  geometry_encoder: VGGT-1B
  geometry_encoder_path: models/VGGT-1B
  teacher: frozen
  thinking: false

design:
  data_sources: [spar_3view, spar_32view]
  view_budget:
    spar_32view:
      teacher: 32
      student: 16
      student_rule: required_views union farthest-point extras; empty required pins frame 0
    spar_3view:
      teacher: 3
      student: 3
      note: "N/K=1; no view privilege"
  source_plans:
    spar_3view: data/mvopsd/plan_single_spar_3view/
    spar_32view: data/mvopsd/plan_single_spar_32view/
  note: >
    plan_single_spar_32view 的 teacher_view_indices 仍是 cap-8；本轮 builder 重置为
    range(32) 并用原始 body 作为 teacher_body。不要复用 plan_spar_all。
  builder: scripts/opsd/build_spar_t32_s16_plans.py
  parquet: data/mvopsd/parquet_spar_t32_s16/main_train.parquet
  train_rows: 54495
  holdout_rows: 1000
  train_by_source: {spar_3view: 33970, spar_32view: 20525}
  total_steps: 1135   # floor(54495 / 48)
  epochs: 1.0
  train_batch_size: 48
  test_freq: 50
  save_freq: 50
  max_actor_ckpt_to_keep: 3
  shared_protocol:
    - "ROLLOUT_NAME=hf"
    - "lr 2e-6 / batch 48 / rollout.n=1 / frozen teacher"
    - "teacher_enable_thinking=False"
    - "VAL_FILE=vsibench_val_boxed_lastline_sub480.parquet"
    - "VAL_DO_SAMPLE=0 greedy (rerun 2026-09-16; sample run aborted)"
    - "JUDGE=0"
    - "WANDB_MODE=online project=MV-OPSD"

