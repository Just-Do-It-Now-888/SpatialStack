experiment_id: 20260915_spatialstack_mvopsd_spar_t32_s16
title: "SpatialStack SPAR 全量 MV-OPSD：Teacher 32 / Student 16（必含关键帧）"
status: running

created_at: "2026-09-15T15:52:00+08:00"
