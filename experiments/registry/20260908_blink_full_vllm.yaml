    at: "2026-09-08T13:03:06+08:00"
    symptom: >
      spar3_original 在 base_original 结束后 17s 以 rc=135（Bus error）退出，
      run.log 为空。
    evidence: logs/eval/20260908_blink_full_vllm/driver.log
    root_cause: >
      上一臂 vLLM/NCCL Destroy COMPLETE 后立刻再起 TP=8；同时 harness 在建引擎前
      对 1901 行全部解码图像。
    solution: >
      臂间 sleep 20 + 再次 wait_gpus_free；启动前不再预解码全库，limit_mm=8。
    status: resolved
    prevention: >
      串行 vLLM 臂之间必须等显存真正空且再留缓冲，不要在 Destroy COMPLETE 当秒重启。

