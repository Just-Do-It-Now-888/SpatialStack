goal: >
  对 output/spatialstack_qwen35_train（20260909 geo SFT）补跑 CV-Bench、BLINK-Spatial、
  SPAR-Bench 冷启动分数，作为 MV-OPSD 三集模拟/对照的真实锚点。VSI 已有实测 66.59。

relations:
