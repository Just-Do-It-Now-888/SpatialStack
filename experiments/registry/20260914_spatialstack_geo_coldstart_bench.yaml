  geometry_encoder: models/VGGT-1B
  impl: qwen3_5

evaluation:
  engine: huggingface_lmms_eval
  conda_env: sr_opsd
  launcher: scripts/opsd/run_spatialstack_geo_bench_eval.sh
  protocols:
    cvbench:
      CVBENCH_PROTOCOL: spatialstack
      max_new_tokens: 1024
      metric: combined_accuracy
    blink_spatial:
      BLINK_PROTOCOL: spatialstack
      VSIBENCH_BOXED_PRIMARY: "1"
      max_new_tokens: 1024
      metric: blink_spatial_macro
      n_tasks: 3
      note: >
        只报 HF blink_spatial（multi_view / relative_depth / spatial_relation）。
        不报 14 任务全量 BLINK。
    sparbench:
      SPARBENCH_PROTOCOL: boxed
      SPARBENCH_MAX_NEW_TOKENS: 2048
      metric: sparbench_score
  smoke:
    limit: 8
    gpus: "0"
    gates:
      - "loads Qwen3_5ForConditionalGenerationWithGeometry"
      - "cvbench_answered > 0"
      - "no CUDA OOM"
  full:
    gpus: "0,1,2,3,4,5,6,7"
    output_root: logs/eval/20260914_spatialstack_geo_coldstart
  results:
