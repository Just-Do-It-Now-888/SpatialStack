issues:
  - id: ISSUE-001
    status: fixed
    symptom: >
      cv_boxed_base 31s 结束，status 记 rc=0，但无 results.json。日志
      OfflineModeIsEnabled / Couldn't reach nyu-visionx/CV-Bench。
    evidence: logs/eval/20260905_cvbench_blink_sample/cv_boxed_base/run.log
    root_cause: >
      驱动把 HF_DATASETS_CACHE 指到 ~/.cache/huggingface/datasets；
      成功的 20260901 跑用的是 $PROJECT/cache/datasets。accelerate 在
      worker 报错后仍可能返回 0，链式脚本只看 eval.sh 退出码。
    solution: >
      HF_DATASETS_CACHE=$PROJECT_ROOT/cache/datasets；评测结束后必须存在
      *_results.json。失败臂目录改名为 *_offline_fail。
    prevention: >
      评测驱动对齐历史 dump 的 hf_datasets_cache；不要用进程退出码当分数落盘。
  - id: ISSUE-002
    status: open
    symptom: >
      blink_boxed_base 无 results.json。AttributeError: Dataset has no attribute copy。
    evidence: logs/eval/20260905_cvbench_blink_sample/blink_boxed_base/run.log
    root_cause: >
      src/lmms_eval/api/task.py:1066 self.dataset_no_image = self.dataset.copy()
      在 load_from_disk 得到 HuggingFace Dataset（非 DatasetDict）时失败。
    solution: pending
    prevention: pending

