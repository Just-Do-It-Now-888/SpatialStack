experiment_id: 20260820_mvopsd_view_ratio
title: "MV-OPSD 视角落差比例：student = N/2 vs N/4，两机各一条 arm"
status: running  # planned | running | completed | failed | cancelled

created_at: "2026-08-20T01:30:00+08:00"
finished_at: null
owner: "cursor-window-mvopsd"

goal: >
  前四轮（v1、rollout8、lr5e6 x b64/b128、lr1e5 x b64/b128）都收敛到低于自身基座
  约 3~6.5 分的 CV-Bench 渐近线。
  [2026-08-21 订正] 本段原写「JSD 平台一律停在 0.0157」，与实测不符：0.0157 是 v1 的值，
  四条 sweep arm 实测 0.0183~0.0217 且随 LR 单调抬高（见
  20260818_mvopsd_lr_batch_sweep.yaml 的 results.vs_decision_criteria）。
  本轮设计与结论不受影响，但正确的表述是「平台不降反升」而非「平台不动」。
  优化侧的两个旋钮（LR、batch）
  已被证明只改变到达平台的轨迹。用户提出新的怀疑方向：**student 拿到的视角数太少**，
  导致 teacher 的分布对 student 不可达。本轮把 student 预算从「逐样本随机 K∈{1,2,4}」
  改成「相册的固定比例」，在 N/2 与 N/4 两个点上测这条假设。

hypothesis: >
  用户假设：student 视角太少是损伤的主因，把预算提到相册的 1/2 后损伤应明显变轻。
  支持性证据（方向性，不能定量）：用 tools/jsd_by_k_regression.py 对 lr5e6_b64 的
  300 步日志做去趋势横截面回归，K=1 占比的斜率 +0.0082（95% CI [+0.0046,+0.0121]），
  折算「全 K=1 vs 全 K=4」相差约 0.012，而当时 JSD 水平只有 0.019~0.031，即差值占
  四到六成。
  反向证据（必须留出）：JSD 绝对值全程只有 ln2 的 2%~6%（step 1 = 0.041 → 平台 0.0157），
  而 response 平均 250 token 且绝大多数是与视角无关的散文。若真实信号集中在少数答案
  token 上，token-mean 会把它稀释约两个数量级，那么无论 K 取多少，梯度主要在改写作风格
  ——这与「空间能力只掉 3~6 分、作答格式彻底崩坏、Count 掉幅最大」的既有症状更吻合。
  本轮若两臂表现相同，则 K 方向被否掉，下一轮应转向 token 加权。

grouping_rationale: >
  两条 arm 是两个模型设定，合并在一个 registry 里是因为它们共享同一假设、同一套判读
  标准与同一次分析，且数据是同一次生成的嵌套产物。每条 arm 有独立实验名与产物路径。

known_limitation: >
  **本轮无法分离「student 视角太少」与「teacher/student 落差太大」。**每条样本的 N 固定，
  所以 student 拿 N/2 就必然意味着落差是 2 倍，两个变量绑死。这个区分很重要：若主因是前者，
  说明 student 必须看够视角才学得动，方法主打的「低帧预算可用」失去立足点；若是后者，
  只需把 teacher 压低（例如 teacher = 2K），student 可继续只看 1~2 张，方法成立且改动免费。
  需要第三条 arm（student = N/4、teacher = 2K）才能分开，视本轮结果决定是否追加。

arms:
  - arm_id: khalf
    experiment_name: 20260820_qwen35base_mvopsd_khalf_main
    node: node-A
    student_budget: "N/2"
    k_by_n: {8: 4, 32: 16}
    mean_k: 6.96
    mean_ratio: 2.00
    student_visual_tokens_mean: 1337
    train_file: data/mvopsd/parquet_k_half/main_train.parquet
    expected_wallclock_hours: "约 14.5（实测 123.0 s/步 x 300 = 10.3h，加 20 次 CV-Bench 评测约 3.7h 与存档开销）"
    measured_at_launch:
