issues:
  - id: ISSUE-201
    at: "2026-08-20T15:49:00+08:00"
    symptom: >
      重构后的 eval_vsibench_vllm.py 冒烟：vLLM 生成完成（24 题），
      但 summary.json / samples.jsonl 一个都没写，进程挂在退出流程里不结束。
    evidence: >
      py-spy dump 显示主线程停在 multiprocessing 的 _exit_function → join，
      即脚本主体已经抛异常退出、卡在 vLLM 关闭。真正的 traceback 被
      `2>&1 | tail -25` 缓冲吞掉，日志里只剩 NCCL 关闭噪声。
      杀掉 EngineCore 子进程后父进程立刻退出。
    root_cause: >
      build_summary 里按题型和 rule-only 汇总时构造的行少了 question_type 字段，
      而 lmms_eval 的 vsibench_aggregate_results 第一步就是
      `results.groupby('question_type')`，直接 KeyError。
    solution: >
      分题型分数改为直接取该题型指标的均值（数值上等同于聚合函数对单一题型的输出，
      且不依赖 groupby）；rule-only 汇总行补回 question_type。
      补了一个不需要 GPU 的离线自检：造 10 个题型的假记录跑 build_summary + write_results，
      确认 overall 与上游聚合一致、10 个题型齐全、failures/ 分桶正确。
    status: resolved
    prevention: >
      1. 长跑日志不要接 `| tail`——一旦异常，唯一有价值的那段正好被丢掉；写文件再读。
      2. 汇总/落盘这类纯 CPU 逻辑必须有不占 GPU 的离线测试，
         否则每次改动都要付一次 vLLM 起服的代价才知道有没有拼错字段。

  - id: ISSUE-202
    at: "2026-08-20T16:01:00+08:00"
    symptom: >
      run_training_vsibench_eval.sh 阶段二起 judge 服务失败：
      `/usr/bin/python3: No module named 'vllm'`，但同一台机上单独用系统 python 能 import。
    evidence: >
      clean shell 里 `/usr/bin/python3 -c "import vllm"` 输出 0.18.0；
      `conda activate sr_opsd` 之后同一条命令报 ModuleNotFoundError。
      打印 sys.path 发现少了 ~/.local/lib/python3.12/site-packages，
      而 vllm 恰好装在那里；env 里 PYTHONNOUSERSITE=1。
    root_cause: >
      judge 服务按 LESSON-007 跑在系统 python 上，而阶段一需要 conda sr_opsd；
      conda activate 会导出 PYTHONNOUSERSITE=1，把 user site 目录从系统 python
      的搜索路径里摘掉，正好是 vllm 所在的目录。
      原 rejudge_vsibench.sh 没踩到，是因为它在 activate 之前就把服务起好了。
    solution: "起 judge 服务时用 `env -u PYTHONNOUSERSITE`，只对该子进程生效；其余仍在 sr_opsd 内。"
    status: resolved
    prevention: >
      同一脚本里混用两个 python 环境时，跨环境启动的子进程要显式声明它需要的环境，
      不能假设「系统 python 的 sys.path 不受 conda 影响」——PYTHONNOUSERSITE 就是反例。

  - id: ISSUE-203
    at: "2026-08-20T17:20:00+08:00"
    symptom: >
      训练内 VSI 评测第一次跑通后，step 0 基座得 51.61，
      而同一份权重、同一套协议在离线 vLLM harness 上是 52.58，差 0.97。
      逐题型看差异并非均匀噪声：object_rel_direction -5.27、object_counting -4.64，
      另有两个题型反而 +2 左右。
    evidence: >
      打分链本身已排除：test_vsibench_in_training.py 回放归档的 5,130 条真实响应，
      训练内的 reward + metrics 算出 52.57，与离线公布的 52.58 及 lmms_eval 现算值一致，
      所以差异只可能来自生成侧。
      直接比对两侧 apply_chat_template 的渲染结果：离线是
      `<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n<|im_start|>user...`，
      训练内是 `<|im_start|>user...`，没有 system 轮。
      Qwen3.5 的 chat template 不会自动补默认 system prompt，verl 也只对 parquet 里
      给的消息套模板（agent_loop.py:287-297），所以少了就是真的少了。
      响应长度分布同向佐证：离线 mean 374.7 字符，训练内 558.2，
      中位数同为 3~4——即多出来的都是长尾的跑题，正是选择题掉分最多的那几个题型。
    root_cause: >
      build_vsibench_val_parquet.py 照抄了 build_cvbench_val_parquet.py 的 prompt 结构，
      而后者只有 user 一轮。CV-Bench 那边两侧都没有 system 轮所以自洽，
      VSI 的离线路径（lmms_eval/models/qwen3_5.py）却是带 system 轮的，照抄就产生了偏差。
    solution: >
      val parquet 的 prompt 改为 [{system: "You are a helpful assistant."}, {user: ...}]，
      重建（帧已缓存，只重写 parquet，约 2 秒）。
      重建后核对：训练内渲染结果与离线协议在归一化图像占位符后逐字节一致。
    status: resolved
    prevention: >
      新建一个「训练内要对齐离线」的验证集时，光对齐题面文本不够，要把
      apply_chat_template 的**最终渲染字符串**拿来逐字节 diff，system 轮、
      generation prompt、thinking 块都在里面。
      这一项之所以被抓到，是因为 val_before_train 会先跑一个基座分——
      有一个已知答案可对照，偏差才会立刻现形。新验证集都应保留这个对照点。

