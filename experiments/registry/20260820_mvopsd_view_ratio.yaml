decision_criteria:
  - metric: "谷底深度（相对自身 step 0）"
    reference: "v1 −9.86pp @ step 30"
    read_as: "N/2 明显变浅 → 支持用户假设"
  - metric: "饱和渐近线 C（相对自身 step 0）"
    reference: "v1 −3.72pp；lr5e6_b64 最佳 83.89"
    read_as: "两臂渐近线之差是本轮的主结果之一"
  - metric: "JSD 平台值 actor/vopd_loss"
    reference: 0.0157
    read_as: "若 N/2 的平台明显低于 N/4，说明落差确实随视角数收窄"
  - metric: "VSI-Bench @ 32 帧（主指标）"
    read_as: >
      唯一能判定方法有效性的量。用户 2026-08-20 收敛为「只测全局最佳 checkpoint @32 帧」，
      因此原计划的 arm x 帧预算网格本轮不做，低帧迁移问题留待后续。
      读数必须同时看 vsibench_answered：分数下降若伴随 answered 下降，是作答格式崩坏，
      不是空间能力退化，两者需要不同的应对。

comparison_scope:
  status: 待核对
  clarified_at: "2026-08-20T12:57:00+08:00"
  statement: >
    本轮两条 arm 的训练超参**不止 K 一项不同**，且这是有意设计：用户的目的就是对比
    两组不同训练超参配置的整体性能差异，而不是做 K 的单变量消融。
  consequence: >
    结论只能表述为「配置 A 优于/相当于配置 B」，**不可归因到 view ratio 单一变量**。
    experiment_id 与 arms 里的 "view_ratio / N2 vs N4" 命名容易被后来者读成单变量消融，
    写报告时必须改写措辞，或补一条真正只改 K 的对照臂。
  correction_history: >
    2026-08-20 12:56 agent 曾把超参不一致误判为混淆因素，并宣布跨臂选点失效；
    12:57 用户澄清那正是实验目的，该误判已撤销。保留以存更正过程。
  todo: "补两臂逐项超参 diff（launch 命令 + 生效 config），报告前必须完成"

interpretation_rule: >
  两臂表现相同 → K 方向被否掉，下一轮转向 token 加权（见 hypothesis 的反向证据）。
  N/2 明显更好 → 需要追加第三条 arm（K=N/4 + teacher=2K）才能判断该把 student 提高
  还是把 teacher 压低。CV-Bench 回到基座**不构成方法有效的证据**，它只是护栏。

must_watch:
  - "actor/vopd_loss：平台值与 0.0157 的关系"
  - "actor/grad_norm：是否顶在 clip_grad=1.0（lr 5e-6 下 v1 稳态约 0.5）"
  - "val-core/cvbench/answered/frac：格式崩溃告警"
  - "val-aux/cvbench/judge/woken：模型开始跑题"
  - "actor/policy_fallback_fraction：应恒为 0"
  - "self_distillation/teacher_probe：应恒定（teacher 冻结）"
  - "data/step/k_views_student/*/frac：half 应为 4 与 16 两档，quarter 为 2 与 8"
  - "response_length/mean 与分源 response_length：散文漂移"

artifacts:
  per_arm_pattern:
    checkpoints: "checkpoints/<experiment_name>"
    train_log: "logs/train/<experiment_name>/"
    val_dumps: "logs/val/<experiment_name>/"
    rollouts: "rollouts/<experiment_name>"
    wandb: "slcheng/MV-OPSD run <experiment_name>"
  checkpoint_budget: >
    save_freq=15 x 300 步 = 每条 20 个 x 约 55GB ≈ 1.1T。每机只跑一条，
    node-A 3.6T / node-B 3.5T 空闲，充裕。
  retention_rule: >
    **训练内 CV-Bench 最佳的 checkpoint 与最后一步的 checkpoint 都要保留**，其余可删。
    保留最后一步是为了检验「用 CV-Bench 挑 checkpoint」这条规则本身是否敏感：
    上一轮四条 arm 的最优步散落在 225/300/180/150，说明后期曲线接近平坦，argmax
    可能落在噪声里（跨机基线本身有 0.25 分抖动）。两个 checkpoint 的 VSI 若接近，
    该选法站得住；若差很多，说明选法有问题，而这只有留了第二个权重才看得出来。

training_metrics:
  measured_at: "2026-08-21"
  source: >
    解析 logs/train/<experiment_name>/train_*.log（kquarter 经 ssh opsd2 取回）。
    口径与 lr_batch_sweep 的 results 一致：末段均值 = 最后 5 个评测点平均；
    JSD 平台 = 最后 20 个训练步的 actor/vopd_loss 均值。
  khalf:
    step0: 86.21
    trough: "79.19 @ step 195"
    best: "83.79 @ step 120"
    tail_mean_last5: 79.90
    delta_vs_step0: -6.31
    jsd_step1: 0.0196
    jsd_plateau: 0.0198
    grad_norm_steady: 0.45
    median_step_seconds: 119.1
    completed_steps: 250   # 按用户要求提前终止
  kquarter:
    step0: 86.23
    trough: "77.61 @ step 195"
    best: "83.26 @ step 75"
    tail_mean_last5: 79.27
    delta_vs_step0: -6.96
    jsd_step1: 0.0365
    jsd_plateau: 0.0237
    grad_norm_steady: 0.46
    median_step_seconds: 111.6
    completed_steps: 267   # 按用户要求提前终止
  reading: >
    两条并列的结论，缺一条都会误导：
    1) **机制成立**：K 从 N/4 提到 N/2，step 1 的 JSD 从 0.0365 降到 0.0196，几乎减半。
       视角预算确实控制着 teacher/student 的信息落差，这与 hypothesis 的方向一致。
    2) **收益不成立**：落差减半没有换来任何下游改善。khalf 的 JSD 从 step 1 的 0.0196
       到 250 步后的 0.0198 基本是一条水平线——在这个落差下已经没有什么可学的了——
       而 CV-Bench 仍低于自身基座 6.31 分，并不优于随机 K 的 −3.7 ~ −4.5。
    两臂 CV-Bench 最佳点仅差 0.53pp（83.79 vs 83.26），单种子无误差棒，
    不足以给两套配置排名。
    按 interpretation_rule，两臂表现相当 → **K 方向被否掉**，下一轮转向 token 加权。
    注意本轮池不含 spar_3view，delta 与 sweep 各 arm 的 delta 属不同池，只比趋势。

evaluation:
  status: done
  results:
    readout_rule: >
      同一 harness 内才可比。HF/lmms_eval 与 vLLM 在基座上差 0.82 分（53.40 vs 52.58），
      截断率与长度分布一致，差异来自引擎而非协议，因此两列不可混表。
      同时全部为 spatialstack 协议（1024 token + 自有解析），
      **不可与历史 16-token 协议下的 64.24 / 67.65 等数字并列**。
    qwen35_4b_base:
      hf_1024: {overall: 53.40, answered_pct: 99.98, truncated_pct: 2.05, median_tokens: 3}
      vllm_1024: {overall: 52.58, answered_pct: 99.94, truncated_pct: 2.18, median_tokens: 4}
      judge_extract_1024: {overall: 53.47, delta: +0.08, flips: "11 对 7，近似对称"}
    khalf_main_step120:
      hf_1024: {overall: 34.82, answered_pct: 93.51, truncated_pct: 21.07, median_tokens: 205}
      vllm_4096: {overall: 33.38, answered_pct: 93.51, truncated_pct: 20.47, median_tokens: 205}
    degeneration_onset:
      note: >
        同一 60 场景子集（632 题）、同一 vLLM harness、同为 1024 预算，因此三点严格可比。
        子集分数与全量分数不可并列（基座全量 52.58 vs 子集 54.15）。
      base:    {overall: 54.15, answered_pct: 100.00, truncated_pct: 0.00,  median_tokens: 4}
      step45:  {overall: 43.18, answered_pct: 96.52,  truncated_pct: 14.40, median_tokens: 168}
      step120: {overall: 35.61, answered_pct: 93.99,  truncated_pct: 17.56, median_tokens: 196}
      reading: >
        单调下滑，**step 45 已掉 11 分**，无回头迹象；退化不是训练后期事件，从早期就开始。
        基座中位长度 4 token（按提示词直接给选项字母），训练后跳到 168~196 token，
        即训练把「直接作答」改成了「写长推理」，而其中一部分收不住并滑入重复循环。
        应在更早的 checkpoint（step 15 / 30）继续回溯，确认是否从第一个评测点就已发生。
    conclusion: >
      **khalf step 120 在 VSI-Bench 上相对基座崩塌约 19 分**（同为 vLLM harness：
      52.58 -> 33.38）。原因不是评测预算：预算从 1024 放宽到 4096 后，
      answered 仍为 93.51%、解析失败仍为 333 条、中位长度仍为 205 token、
      截断率仅从 21.07% 降到 20.47%——原来撞 1024 的那批改撞 4096。
      解析失败的响应形态是**重复退化**：模型逐帧枚举
      （"the fiftieth image shows a chair... the fifty-first image shows a chair..."）
      或直接数数（"189, 190, 191, ... 234"），刷满任何给定预算也不给答案。
