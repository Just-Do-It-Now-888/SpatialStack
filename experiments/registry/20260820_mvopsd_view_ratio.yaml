    Frame-N 重编号，再重写 parquet。
  commands:
    - "python scripts/opsd/build_view_ratio_plans.py"
    - "python scripts/opsd/write_mvopsd_parquet.py --plan data/mvopsd/plan_k_half --out data/mvopsd/parquet_k_half --arms main --check-files"
    - "python scripts/opsd/write_mvopsd_parquet.py --plan data/mvopsd/plan_k_quarter --out data/mvopsd/parquet_k_quarter --arms main"
  filter: "n_views >= 8（等价于既有的 privilege_bucket == strong）"
  counts:
    source_plan: 126480
    kept_after_filter: 84797
    dropped: {spar_3view: 34470, llava_hound_64k: 6986, vlm3r_scannet: 227}
    train_rows: 83123
    holdout_rows: 1674
    composition: {llava_hound_64k: "36.7%", vlm3r_scannet: "36.5%", spar_32view: "24.7%", vsi_appr_order: "2.1%"}
  teacher_side: >
    两臂完全相同（teacher 看全部 N 视角）：mean N = 13.93，max N = 32，
    视觉 token 均值 2674 / 峰值 6144，teacher prompt 峰值 6540 token（上限
    max_reprompt_len = 12288）。teacher 是本轮的对照，不参与变化。
  nesting: >
    N/4 的视角子集是 N/2 子集的真子集（一次洗牌切片得到），且两份 parquet 行序完全一致，
    因此同一 step 两臂看到的是同一批样本，唯一差异是多给的那几张视角。
  verification:
    - "student prompt token：half max 3340 / quarter max 1738，上限 4096（rollout.prompt_length 继承 data.max_prompt_length），无一超限；prompt+1024 response 亦未超 max_model_len 5120"
    - "解析式长度公式与真实 processor 在最长的 10 行上逐行一致（工具 tools/check_prompt_lengths.py，含真实图片）"
    - "teacher prompt token max 6540 < 12288"
    - "嵌套违例 0；两臂行序一致 True；K<N 违例 0"
    - "悬空 Frame-N：student 0、teacher 0（两臂）"
    - "占位符与图片数不匹配：student 0、teacher 0（两臂）"
    - "视角文件 344,627 个全部可读且 patch 对齐；node-B 抽查 32,588 个引用 0 缺失"
  why_this_filter: >
    N>=8 保证 N/4 仍有 >=2 视角，落差是真的；同时把 spar_3view 整批排除——它的 N=3，
    结构上只能产生 K∈{1,2}，使「视角少」与「来自该源」在任何聚合读数里成为同一个变量
    （这正是 jsd_by_k_regression 里 source 与 K 共线、各自 R^2 相当的原因）。

