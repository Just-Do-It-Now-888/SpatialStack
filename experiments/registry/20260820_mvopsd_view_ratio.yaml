      分题型看，object_counting 截断 57~58%、object_rel_distance 约 35%，
      即长视频推理路径整体崩坏，而非个别题型。
    guardrail_failure: >
      **该 checkpoint 是两臂 33 个训练内评测点中 CV-Bench 最高的（83.79%）**。
      单图四选一的护栏对 32 帧视频上的重复退化完全不敏感，
      训练全程没有任何指标提示这一崩溃。
      已据此更换护栏，见 evaluation.in_training_next 与 LESSON-020。
  in_training: >
    本轮实测为「仅 CV-Bench（2,638 条护栏指标）」，且该护栏已被证伪
    （见 guardrail_failure）。自 2026-08-20 起改为下面的 in_training_next，
    从下一轮训练生效；本轮结果不受影响。
  in_training_next:
    decided_by: "用户 2026-08-20 16:00"
    what: >
      训练过程评测改为 **VSI-Bench 全量（5,130 题）@32 帧**，spatialstack 协议，
      vLLM 推理，规则层打分 + LLM judge 只补规则没接受的那部分。
      CV-Bench 训练内评测同时关闭（run_mvopsd.sh 在 VSI_EVAL=1 时置 TEST_FREQ=-1）。
    why: >
      CV-Bench（单图四选一、16 token 就能答完）对 32 帧视频上的重复退化完全不敏感，
      本轮最高 CV-Bench 的 checkpoint 正是 VSI 上崩掉 19 分的那个。护栏必须与主指标同分布。
    where_it_runs: >
      评测节点，与训练节点分离。训练只负责落 checkpoint；
      watch_training_vsibench_eval.sh 轮询到新 global_step_* 就评一个。
    entry:
      watch: "scripts/opsd/watch_training_vsibench_eval.sh checkpoints/<experiment> --poll 120"
      single: "scripts/opsd/run_training_vsibench_eval.sh checkpoints/<experiment>/global_step_N"
      core: "scripts/opsd/vsibench_eval_core.py（生成/打分/judge/错误分类唯一实现）"
    two_phase: >
      单机 8 卡装不下 policy 与 judge 两个引擎，因此拆成两段：
      阶段一 policy 独占 8 卡做 vLLM 生成 + 规则打分，写 samples.jsonl 后退出；
      等显存归零后，阶段二起 gpt-oss-120b，只对规则没接受的行调 judge，
      并**原地重算** summary.json / samples.jsonl / failures/。
      两段都调用 vsibench_eval_core 的同一套函数，避免离线与训练内打分漂移。
    judge_scope: >
      选择题：规则判错的行走 Vision-OPD 的 Yes/No 级联；
      数值题：规则**读不出数**的行走抽取（judge 只回数字，MRA 仍由 lmms_eval 算）。
      规则已接受的行不重开，因此 judge 只能加分不能减分——
      这是已知的单向偏置（LESSON-019），所以 summary.json 同时报 rule_only 与 judge_assisted，
      **趋势判读一律看 rule_only**，judge 列只用来判断「掉分是不是解析造成的」。
    artifacts:
      dir: "logs/vsi_train_eval/<experiment>/<step>/"
      summary_json: >
        overall + 分题型（n / 分数 / rule_only 分数 / answered% / 截断% / 中位输出长度 /
        错误分类计数）+ 输出长度分位数（median/p90/p95/p99/max）+ judge 统计
        （送审行数 / 救回数 / 判不出数 / API 错误数）+ 墙钟与吞吐。
      samples_jsonl: "逐题：响应全文、输出 token 数、finish_reason、规则层与最终层分数、错误标签"
      failures_dir: >
        按标签拆分便于直接翻阅：truncation_error（撞上限）、parse_error（没截断但读不出答案）、
        partial_error（数值题 0 < MRA < 1）、factual_error（读出来了但答错）、
        judge_recovered（规则判错、judge 救回）。
    failure_tag_rule: >
      判定顺序：满分 → correct；否则截断 → truncation_error；否则读不出 → parse_error；
      否则 0 < 分数 < 1 → partial_error；否则 factual_error。
      截断优先于解析失败，因为缺的是尾巴而不是格式。
      partial_error 只会出现在数值题——选择题分数非 0 即 1。
    cost: >
      基座全量 vLLM 生成约 17 分钟（8 卡 TP=8，scenes-per-batch 24），
      judge 起服约 100 秒 + 判几百行数分钟，单 checkpoint 合计约 25~30 分钟。
      SAVE_FREQ 默认 50 步；若训练约 1 步/分钟，评测不会积压。
    wiring_check:
      at: "2026-08-20T16:06:00+08:00"
      how: "LIMIT_SCENES=4 JUDGE=1，基座 4 场景 35 题，跑完整两阶段"
      result: >
        通过。阶段一 → 二显存归零后交接成功；judge 100 秒就绪；
        8 行送审、0 行救回、0 判不出、0 API 错误（基座上规则解析本就可靠，符合预期）；
        summary.json 同时含 rule_only 与 judge_assisted，failures/ 正确落盘。
        产物留在 logs/vsi_train_eval/_wiring_check/（4 场景，**不是可用分数**）。
  offline_primary:
    benchmark: VSI-Bench
    frames: [32]
    checkpoint_selection: >
      用户 2026-08-20 11:30 决定只测一个 checkpoint。两臂 33 个训练内评测点里 CV-Bench
      combined 最高的是 khalf step 120 = 83.79%（次高 kquarter step 75 = 83.26%）。
      读数约束：两臂训练超参本就不同（有意设计，见 comparison_scope），跨臂比较是本轮目的，
      但 0.53pp 的差距在单种子、无误差棒的护栏指标上不足以给两套配置排名——
      选 khalf 120 是合理取点，不等于它已被证明更优。
    baseline_anchor: >
      Qwen3.5-4B 基座 @32 帧，同协议，node-B 并行（run_name=20260820_qwen35base_vsi_anchor）。
      基座在本项目从未测过 VSI，缺了它单个 checkpoint 的数字无从判读。
    entry: "scripts/opsd/run_view_ratio_vsi_eval.sh（FRAMES=\"32\"）"
    protocol:
      switch: "VSIBENCH_PROTOCOL，默认 spatialstack；lmms_legacy 复现上游 16-token 协议"
      max_new_tokens: 1024
      until: "[]（清空，否则 TaskConfig 用空行当停止符，长推理在第一段就被截断）"
      parser: >
        scripts/opsd/vsibench_scoring.py。选择题只在题目**实际提供的选项字母**里取答案
        （优先 "answer is X"，其次 (X)，再次末行裸字母，最后唯一匹配选项正文）；
        数值题取显式答案句或末行数字，支持千分位。上游的 pred.split(' ')[0] 在长推理下
        只会读到 "Based"：选择题记 0，数值题 to_float 返回 None 并被记成最差 MRA。
      metrics_unchanged: >
        **只改解析，不改指标**。MCA 仍是 exact match，NA 仍是 MRA:.5:.95:.05，
        总分仍是题型间非加权平均（direction 三档先合并），全部沿用 lmms_eval 原实现。
      validation: >
        scripts/opsd/tests/test_lmms_vsibench_protocol.py（新，全绿）。关键一项是回放 5 个
        历史短答 run：新旧解析器打分逐个完全一致（novggt_aligned 两侧均 64.24），
        证明改动只是"换了去哪里找答案"，没有移动任何已发布的数字。
      new_metric: "vsibench_answered——多少行能读出答案，与分数分开报告"
    not_comparable_with: >
      1024-token 协议下的绝对值**不可与历史 64.24 / 67.65 等并列**，那些是 16-token 协议下
      测的 SFT 模型。本轮只能与同协议的基座锚点比。
    prerequisites:
      - "merge FSDP checkpoint 成 HF 格式（scripts/opsd/merge_mvopsd_ckpt.sh），目录须含 config.json（LESSON-002）"
      - "评测跑在 conda sr_opsd，不是训练的系统 python（LESSON-007）"
      - "取消 HF_HUB_OFFLINE / TRANSFORMERS_OFFLINE（LESSON-003）"
  skipped_by_decision: >
