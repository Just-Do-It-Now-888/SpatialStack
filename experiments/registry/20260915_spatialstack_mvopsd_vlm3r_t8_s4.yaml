issues:
  - id: ISSUE-001
    status: resolved
    phase: training
    discovered_at: "2026-09-15T20:50:00+08:00"
    symptom: "node-C 以 root SSH 启动时 wandb online 找不到凭证"
    evidence: >
      首次正式启动 train.nohup.log：wandb is set to online but no credentials were found。
      /home/c30084464/.netrc 在 C 上原先不存在；拷贝后 netrc 因 owner 不是 root 被拒绝。
    root_cause: >
      node-C 家目录不是 node-A 的 live NFS；root 的 HOME 指向 /home/c30084464 时
      Python netrc 安全检查要求文件属主与当前用户一致。
    solution: >
      将凭证放到 /root/.netrc（600）；launch 脚本在 WANDB_API_KEY 为空时从
      /root/.netrc 读取 api.wandb.ai 密码并 export。
    prevention: "LESSON-042：node-C root 训练显式 HOME=/home/c30084464 且 wandb 走 /root/.netrc 或 WANDB_API_KEY"
  - id: ISSUE-002
    status: mitigated
    phase: smoke
    discovered_at: "2026-09-15T20:49:00+08:00"
    symptom: "SMOKE 两步完成后 wandb offline teardown BrokenPipeError"
    evidence: "smoke log 有 training/global_step:2；进程已退出；GPU 回 0 MiB"
    root_cause: "offline wandb 收尾管道断开，不阻断闸门"
    solution: "确认 step=2 与闸门后改 WANDB_MODE=online 正式训"
    prevention: "冒烟以 checkpoint/global_step 与闸门指标为准，不把 wandb teardown 当训练失败"
  - id: ISSUE-003
    status: resolved
    phase: evaluation
    discovered_at: "2026-09-16T06:59:56+08:00"
    symptom: "训完 chain_after merge 失败，全集 boxed 未启动；C 卡空闲"
    evidence: >
      chain_after.nohup.log：ModuleNotFoundError: No module named 'ray'。
      merge_mvopsd_ckpt.sh 默认 PYTHON_MERGE=/usr/bin/python3。
    root_cause: "eval_after 未 activate sr_opsd，也未覆盖 PYTHON_MERGE"
    solution: "PYTHON_MERGE 指向 sr_opsd python；eval_after 先 conda activate sr_opsd。greedy 重跑后的 chain_after 走新路径。"
    prevention: "merge/eval 入口强制 conda sr_opsd，不要用系统 python"
  - id: ISSUE-004
    status: resolved
    phase: evaluation
    discovered_at: "2026-09-17T09:02:35+08:00"
    symptom: "lastline VSI 启动即 LocalEntryNotFoundError"
    evidence: >
      last3_then_benches.log：Cannot find cached snapshot for nyu-visionx/VSI-Bench
      and outgoing traffic has been disabled (HF_HUB_OFFLINE=1)。
    root_cause: "C 上已有 vsibench 视频与 datasets arrow，但缺少 hub 目录 datasets--nyu-visionx--VSI-Bench"
    solution: "从 A rsync hub snapshots（VSI/CV/BLINK/SPAR）后重跑 lastline"
    prevention: "HF_HUB_OFFLINE=1 前核对 hub/datasets--* 快照，不只 rsync 视频目录"
  - id: ISSUE-005
    status: open
    phase: evaluation
    discovered_at: "2026-09-17T12:03:43+08:00"
    symptom: "BLINK-Spatial 启动失败，目录为空"
    evidence: >
      last3_then_benches.log：ValueError unknown BLINK_PROTOCOL 'lastline';
      expected one of ('original', 'spatialstack')。随后 SPAR 仍跑完，脚本标 DONE。
    root_cause: >
      node-C 家目录非 live NFS；评测时 C 上 blink/utils.py 尚无 lastline。
      node-A 后来已加入 lastline。
    solution: "未补跑。若要分数：同步 utils 后只跑 blink_spatial。"
    prevention: "跨机评测前核对 C 上 BLINK_PROTOCOLS / CV / SPAR 协议集合"

