  Teacher 看满 8 帧，Student 看 4 帧且必含 oracle 关键帧。正式训练 wandb online。

hypothesis: >
  与 SPAR T32/S16 同协议换源：钉住关键帧后 8→4 仍保留特权间隙。只相对本臂 step 0；
  不可与 20260826 基座 vlm3r 或 SPAR T32 曲线并列相减。

