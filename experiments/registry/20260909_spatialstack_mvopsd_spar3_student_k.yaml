experiment_id: 20260909_spatialstack_mvopsd_spar3_student_k
title: "SpatialStack 几何权重 + SPAR3 nested K=1/K=2 MV-OPSD（HF generate，非 vLLM）"
status: completed

created_at: "2026-09-09T22:53:00+08:00"
started_at: "2026-09-09T22:53:00+08:00"
owner: "cursor-window-spatialstack"

goal: >
  在 SpatialStack Qwen3.5+VGGT 几何融合权重上，复用 20260831 SPAR3 nested
  K=1/K=2 协议跑 MV-OPSD。老师始终 3 视角；学生 K=1 与 K=2 同题嵌套。
  引擎是 HF generate，不能与历史 vLLM SPAR3 分数对减。

hypothesis: >
  几何融合初始化下，K=1 相对本臂 step 0 仍可能有增益；K=2 缩小 N/K 后
  增益不应系统性差于 K=1。若两臂相对自身 step 0 走平，则问题不在 student 视角数。

relations:
  init_from: 20260909_spatialstack_qwen35_geo
  protocol_copy: 20260831_mvopsd_spar3_student_k
  engine: hf_generate  # not vLLM; VGGT custom class

design:
  why_matched_pool: >
    与 20260831 相同：交集 4,380，train 4,064 / holdout 316；K=1 ⊂ K=2。
  train_rows: 4064
  teacher_views: 3
  arms:
    k1:
      experiment_name: 20260909_spatialstack_mvopsd_spar3_k1
      node: node-B
      k_views_student: 1
      mean_ratio: 3.0
      train_file: data/mvopsd/parquet_spar3_k1/main_train.parquet
    k2:
      experiment_name: 20260909_spatialstack_mvopsd_spar3_k2
      node: node-A
      k_views_student: 2
      mean_ratio: 1.5
      train_file: data/mvopsd/parquet_spar3_k2/main_train.parquet
      start_after: "node-A SpatialStack VSI dual eval PGID 1408911"
  total_steps: 84   # 4,064 行 / batch 48 ≈ 1 epoch（原 63 步是 batch 64 的算法）
  epochs: 1.0
  test_freq: 7      # 与 batch 64 下的 5 步同采样量
  save_freq: 7
  gpu_layout:
    k2_node_a: "8 卡；与外部作业共卡（每卡约 25.8GB，剩 ~72GB/卡）"
    k1_node_b: "GPUS=0,1,2,3,4,5；6-7 被外部作业各占 91GB（ISSUE-005）"
    batch_rationale: "48 同时被 6 与 8 整除，两臂全局 batch 一致，可比"
  max_actor_ckpt_to_keep: 3
  shared_protocol:
    - "MODEL_PATH=output/spatialstack_qwen35_train"
    - "ROLLOUT_NAME=hf"
    - "geometry_encoder frozen; fusion+LLM train"
    - "teacher_enable_thinking=False; student enable_thinking=false"
    - "lr 2e-6 / batch 48 / rollout.n=1 / frozen teacher"
    - "VAL_FILE=vsibench_val_boxed_lastline_sub480.parquet（训练内曲线；全量 5130 行离线补测）"
    - "VAL_DO_SAMPLE=1 t=1.0 top_p=0.8"
    - "JUDGE=0"
    - "data.val_batch_size=48 = train batch（HF 32-frame；不是 vLLM 的 256）"
    - "rollout.agent.num_workers = 实际卡数（否则 agent loop chunk 不整除直接挂）"
  smoke:
    file: data/eval/vsibench_verl/vsibench_val_boxed_lastline_smoke8.parquet
    steps: 2
    batch: 8
    gates:
      - "loads Qwen3_5ForConditionalGenerationWithGeometry"
      - "policy_fallback_fraction=0"
      - "teacher_image_swap_fraction=1.0"
      - "k1 k_views_student/1/frac=1.0"
      - "teacher_probe constant and != Qwen-base 0.044569..."
      - "vopd_loss nonzero"

read_rules:
  - "每臂只相对自己的 step 0"
  - "k1 vs k2 可同协议比较"
  - "不可与 lmms-eval boxed 48.06 / plain 52.75 对减"
  - "不可与 20260831 vLLM SPAR3 46.27/49.23 对减"

launch:
  k1_smoke:
    node: node-B
    env: "system python3.12 + ~/.local (LESSON-030)"
    command: |
      env -u PYTHONNOUSERSITE -u CONDA_PREFIX -u CONDA_DEFAULT_ENV -u CONDA_SHLVL \
          -u CONDA_PYTHON_EXE -u CUDA_VISIBLE_DEVICES \
          PATH=/usr/bin:/usr/local/bin:/bin \
        ARM=k1 SMOKE=1 bash scripts/opsd/launch_spatialstack_spar3_mvopsd.sh
  k1:
    node: node-B
    env: "system python3.12 + ~/.local"
    command: |
      env -u PYTHONNOUSERSITE -u CONDA_PREFIX -u CONDA_DEFAULT_ENV -u CONDA_SHLVL \
          -u CONDA_PYTHON_EXE -u CUDA_VISIBLE_DEVICES \
          PATH=/usr/bin:/usr/local/bin:/bin \
        ARM=k1 bash scripts/opsd/launch_spatialstack_spar3_mvopsd.sh
  k2:
    node: node-A
    env: "conda vision-opd (ISSUE-702: node-A ~/.local ABI 不可用)"
    command: |
      source ~/miniconda3/etc/profile.d/conda.sh
      conda activate vision-opd
      env -u CUDA_VISIBLE_DEVICES \
        ARM=k2 bash scripts/opsd/launch_spatialstack_spar3_mvopsd.sh
    queued_with: |
      setsid nohup bash scripts/opsd/tools/chain_after.sh 1408911 80000 -- \
        bash -lc 'source ~/miniconda3/etc/profile.d/conda.sh && conda activate vision-opd && cd /home/c30084464/Documents/code/SpatialStack_OPSD && env -u CUDA_VISIBLE_DEVICES ARM=k2 bash scripts/opsd/launch_spatialstack_spar3_mvopsd.sh' \
        > logs/train/20260909_spatialstack_mvopsd_spar3_k2/queue.log 2>&1

