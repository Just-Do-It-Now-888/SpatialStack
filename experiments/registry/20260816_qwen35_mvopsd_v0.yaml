    - scripts/opsd/materialize_mvopsd_views.py # stage 2：抽帧 + resize + marker 烘焙
    - scripts/opsd/write_mvopsd_parquet.py     # stage 3：写 verl parquet
    - scripts/opsd/check_mvopsd_geometry.py    # 几何一致性校验
    - scripts/opsd/run_mvopsd.sh
    - scripts/opsd/merge_mvopsd_ckpt.sh
