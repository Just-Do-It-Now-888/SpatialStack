    - verl_pkg/verl/workers/fsdp_workers.py    # 新增 vision_attn_implementation 开关

environment:
  conda_env: system python3.12（非 conda）
  nodes: 1
  gpus_per_node: 8
  gpu_type: "95 GiB / 卡"
  notes: >
    flash_attn 2.7.4.post1+25.11、transformers 5.5.0、torch 2.10.0+cu128、vllm 0.18.0。
    本镜像缺 jmespath（vllm sagemaker 入口依赖），已 pip 安装。
    本镜像缺 decord，stage 2 抽帧改用 PyAV。

model:
  backbone: "Qwen3.5-4B (Qwen3_5ForConditionalGeneration)"
  model_path: "./output/spatialstack_qwen35_novggt_aligned"
  geometry_encoder: "none（no-VGGT 对齐版 SFT 权重）"
  geometry_encoder_path: ""
  base_experiment: 20260813_qwen35_geo_baseline

data:
  training_datasets:
    - spar_234k
    - llava_hound_64k
    - vlm3r_scannet
    - vsi_appr_order
  dataset_version: "mvopsd-v0 (seed 20260816, K menu 1/2/4)"
  build_pipeline:
    stage1: "python3 scripts/opsd/build_mvopsd_plan.py"
    stage2: "python3 scripts/opsd/materialize_mvopsd_views.py"
    stage3: "python3 scripts/opsd/write_mvopsd_parquet.py"
  artifacts:
    plan: "data/mvopsd/plan/plan.jsonl"
    stats: "data/mvopsd/plan/stats.json"
    view_cache: "data/mvopsd/views (474,757 张，24 GB)"
    train_main: "data/mvopsd/parquet/main_train.parquet (124,306)"
    train_noprivilege: "data/mvopsd/parquet/noprivilege_train.parquet (124,306)"
    holdout: "data/mvopsd/parquet/{main,noprivilege}_holdout.parquet (2,174)"
  composition:
    llava_hound_64k: 38009
    spar_3view: 34470
    vlm3r_scannet: 31067
    spar_32view: 21025
    vsi_appr_order: 1909
  student_view_budget:
    K1: 28700
    K2: 61470
    K4: 36310
  exclusions:
    single_view_no_gap: 45336        # N=1，无法构造特权差
    zero_privilege_all_views_required: 13781
    required_views_exceed_k_budget: 2741
    answer_references_view_ordinal: 241
    vsibench_scene_leak: 19          # scene0685_00
    excluded_spar_types:
      - position_matching
      - distance_infer_center_oc_mv
      - view_change_infer
      - camera_motion_infer
      - appearance_order
      - obj_frame_locate

training:
  status: planned
  entrypoint: scripts/opsd/run_mvopsd.sh
  command: |
    scripts/opsd/run_mvopsd.sh main          # 特权组
    scripts/opsd/run_mvopsd.sh noprivilege   # 对照组：teacher 视角 == student 视角
  parameters:
    seed: 20260816
    learning_rate: 2.0e-6
    total_batch_size: 64        # 64 prompts x rollout_n 4 = 256 序列/步
    rollout_n: 4
    total_training_steps: 300
    max_prompt_length: 4096
    max_response_length: 512
    loss_mode: vopd
    loss_agg_mode: seq-mean-token-mean
    alpha: 0.5
    is_clip: 2.0
    distillation_topk: 100
    teacher_regularization: ema
    teacher_update_rate: 0.05
    image_patch_size: 16        # Qwen3.5 patch 16 / merge 2，verl 默认 14 会错位
    gpu_memory_utilization: 0.35
    vision_attn_implementation: sdpa
  artifacts:
    output_dir: "checkpoints/20260816_qwen35_mvopsd_v0_{main,noprivilege}"
    checkpoint: ""
    train_log: "logs/train/20260816_qwen35_mvopsd_v0_{main,noprivilege}"
    rollouts: "rollouts/20260816_qwen35_mvopsd_v0_{main,noprivilege}"
  results:
    metrics: {}
    summary: ""
    failure_reason: ""

evaluation:
  status: planned
  entrypoint: scripts/opsd/eval_frame_budget.sh
  command: |
    scripts/opsd/merge_mvopsd_ckpt.sh checkpoints/<exp>/global_step_N
    scripts/opsd/eval_frame_budget.sh output/<exp>_global_step_N_hf <exp>
  benchmarks: [vsibench]
  parameters:
    frames: [1, 2, 4, 8, 16, 32]
    disable_thinking: true
    note: >
      主张是「低帧预算下更强」，所以必须看整条帧预算曲线；
      只报 32 帧的单点既不能证实也不能证伪。
  artifacts:
    eval_root: "logs/eval/20260816_qwen35_mvopsd_v0_{main,noprivilege}"
  results:
    metrics: {}
    summary: ""
    failure_reason: ""

