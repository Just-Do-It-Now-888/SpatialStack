issues:
  - id: ISSUE-001
    status: resolved
    phase: training
    discovered_at: "2026-08-16T02:55:00+08:00"
    symptom: "verl 启动即失败：ModuleNotFoundError: No module named 'jmespath'"
    evidence: "vllm/entrypoints/sagemaker/api_router.py 导入 model_hosting_container_standards 链路"
    root_cause: "镜像里 vllm 0.18 的 sagemaker 入口缺依赖"
    solution: "pip install jmespath (1.1.0)"
    prevention: "换环境后先跑一次 SMOKE=1，不要直接起正式训练"

  - id: ISSUE-002
    status: resolved
    phase: training
    discovered_at: "2026-08-16T03:00:00+08:00"
    symptom: "vLLM 起不来：Free memory on device cuda:0 (45.76/95.08 GiB) < gpu_memory_utilization 0.6"
    evidence: "/tmp/mvopsd_smoke.log；FSDP 以 fp32 建 actor + ref(EMA teacher) 两份模型"
    root_cause: "同一 worker 里 actor、EMA teacher 和 vLLM 共用一张卡，0.6 的预留过大"
    solution: "mvopsd.yaml 把 rollout.gpu_memory_utilization 降到 0.35；实测训练峰值 reserved 约 52-58 GB"
    prevention: "改 batch、rollout_n 或视角上限后重新看 perf/max_memory_reserved_gb"

  - id: ISSUE-003
    status: resolved
    phase: training
    discovered_at: "2026-08-16T03:05:00+08:00"
    symptom: >
      actor 前向在视觉塔崩：RuntimeError: Cannot access data pointer of Tensor
      that doesn't have storage（flash_attn_varlen_func）
    evidence: >
      脱离 verl 也能复现；最小复现显示 flash_attn 2.7.4.post1+25.11 的
      varlen_fwd 只在 causal=False 且 out=None 时崩，causal=True 或预分配 out 都正常
    root_cause: >
      本镜像的 flash-attn 构建对非因果 varlen 路径有 bug。SFT 加载 Qwen3.5 时
      不传 attn_implementation 所以没踩到；verl 默认对全模型强制 flash_attention_2，
      而视觉塔是双向注意力
    solution: >
      fsdp_workers.py 增加 override_config.vision_attn_implementation，
      用 transformers 5 的映射形式只把 model.visual 换成 sdpa，语言塔保持
      flash_attention_2（use_remove_padding 打包序列需要 varlen）
    prevention: "见 LESSONS.md LESSON-005"

  - id: ISSUE-004
    status: resolved
    phase: training
    discovered_at: "2026-08-16T03:26:00+08:00"
    symptom: "smoke 复跑直接从 step 3 开始，并且第一次 smoke 把 54 GB checkpoint 写进了正式实验目录"
    evidence: "日志 'Found checkpoint ... global_step_2' / 'Resuming from'；checkpoints/20260816_qwen35_mvopsd_v0_main"
    root_cause: >
      run_mvopsd.sh 在加 _smoke 后缀之前就算好了 CKPT_DIR/LOG_DIR/ROLLOUT_DIR；
      同时 verl 的 trainer.resume_mode 默认 auto
    solution: "把 SMOKE 分支移到目录计算之前，并在 SMOKE 时追加 trainer.resume_mode=disable；已删除误写的产物"
    prevention: "见 LESSONS.md LESSON-006"

