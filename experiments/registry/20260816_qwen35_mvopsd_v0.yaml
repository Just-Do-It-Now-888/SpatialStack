experiment_id: 20260816_qwen35_mvopsd_v0
title: "MV-OPSD v0：多视角特权自蒸馏（teacher 看 N 视角，student 看 K<N 视角）"
status: planned  # planned | running | completed | failed | cancelled

created_at: "2026-08-16T02:20:00+08:00"
finished_at: null
owner: "cursor-window-mvopsd"

goal: >
  把 Vision-OPD 的「裁剪特权视图教全图」换成「多视角特权教有限视角」：
  teacher 看同一场景的 N 个视角，student 看其中 K < N 个视角，
  两者在 student 自己采样出的回答上做 token 级分布匹配（JSD）。
  唯一的特权轴是视角数量，分辨率、marker、prompt 模板全部对齐。
hypothesis: >
  低帧预算下（1-4 帧）的空间推理正确率会提升，因为 teacher 的多视角后验
  给出了单帧看不到的空间约束；高帧预算（32 帧）下的提升会小很多。
  若 noprivilege 对照组（teacher 视角 == student 视角）也提升，
  说明增益来自 on-policy 自蒸馏本身而不是视角特权。

