parameters:
  shared:
    arm: main
    model: ./models/Qwen3.5-4B
    teacher_regularization: frozen
    rollout_n: 4
    total_training_steps: 300
    test_freq: 15
    save_freq: 15
    lr_warmup_steps: 10          # 脚本 226 行硬编码，本次未改
    lr_schedule: "10 步线性 warmup 后恒定，无 decay"
    clip_grad: 1.0               # verl 默认；v1 稳态 grad_norm 约 0.5，基本不触发
    loss_agg_mode: token-mean
    ppo_mini_batch_size: "= train_batch_size（脚本 222 行），故每步一次更新，严格 on-policy"
    ppo_micro_batch_size_per_gpu: 1
    seed: 20260816
    judge: enabled (gpt-oss-120b, port 8100, sleep level 1)
    val_file: data/eval/cvbench_verl/cvbench_val.parquet  # lmms_eval 排版
  launch_commands:
    node-A: "LR=5.0e-6 TAG=lr5e6 setsid nohup bash scripts/opsd/run_lr_batch_sweep.sh > logs/train/_sweep/lr5e6_driver.log 2>&1"
    node-B: "LR=1.0e-5 TAG=lr1e5 setsid nohup bash scripts/opsd/run_lr_batch_sweep.sh > logs/train/_sweep/lr1e5_driver.log 2>&1"
  driver_behaviour:
    chaining: "batch 64 跑完立即起 batch 128，中间等端口 8100 与显存释放"
    fast_failure_guard: >
      某条 arm 在 1800s 内非零退出时中止整链（LESSON-007：不要让后续作业按同一个
      环境故障逐个空转）；超过 1800s 的失败视为训练问题，后续 arm 继续跑。
    cold_start_guard: "checkpoints/<name> 非空则跳过该 arm（ISSUE-101）"
    disk_guard: "可用空间低于 1300GB 时跳过该 arm"

