decision_criteria:
  - metric: "谷底深度（相对自身 step 0）"
    v1_value: "−9.86pp @ step 30"
    pass_if: "明显变浅"
  - metric: "饱和渐近线 C（相对自身 step 0）"
    v1_value: "−3.72pp"
    pass_if: ">= −1.0pp"
  - metric: "JSD 平台值 actor/vopd_loss"
    v1_value: 0.0157
    pass_if: "< 0.0157"
  - metric: "ADE20K/COCO Count 净变化"
    v1_value: "−9.36 / −8.52"
    pass_if: "不再是跌幅最大项"

interpretation_rule: >
  若谷底变浅但渐近线与 JSD 平台都不动，则这两个旋钮改善的是训练轨迹而非终点，
  瓶颈在视角信息落差本身，不在优化。若 LR 越大谷底越深，则「增大 LR」这个方向
  直接被否掉。
  （原先此键误缩进在 decision_criteria 列表内部，使整个 YAML 无法解析，
  2026-08-21 提为顶层键。）

