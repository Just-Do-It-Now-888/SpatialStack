issues:
  - id: ISSUE-104
    status: resolved
    phase: launch
    discovered_at: "2026-08-18T21:59:00+08:00"
    symptom: >
      两机的 arm1 在启动约 130s 后同时以 rc=1 退出：
      `RuntimeError: Error loading module from module_path='./scripts/opsd/mvopsd_reward.py'`。
      驱动脚本的 fast-failure guard 判定为环境故障并中止了整链，未浪费机时。
    evidence: >
      栈底是 `ModuleNotFoundError: No module named 'cvbench_scoring'`，
      抛在 scripts/opsd/mvopsd_reward.py 第 25 行，且发生在 Ray worker 内
      （traceback 经 ray/_private/worker.py -> importlib._bootstrap_external.exec_module）。
      mvopsd_reward.py 的 mtime 是 2026-08-18 13:48，cvbench_scoring.py 是 13:49，
      都晚于 v1（08-17 22:00 启动）与 rollout8（08-18 03:12 启动），
      因此这两条 run 用的是改动前的版本，改动后从未有人起过新 run。
    root_cause: >
      verl 通过 `import_utils.load_module` 的 `spec_from_file_location` 按路径加载
      reward 文件，这条路径**不会**把文件所在目录放进 sys.path，所以同目录的
      `from cvbench_scoring import ...` 在 worker 里解析不到。
      仓库里其他 sibling import（tools/cvbench_parity_report.py、
      tests/test_cvbench_val_parity.py、build_cvbench_val_parquet.py）都在 import 前
      自己 `sys.path.insert` 过；mvopsd_reward.py 把 `# noqa: E402` 抄了过来，
      却漏了配套的路径设置，于是只在"按路径加载"这一条调用链上失败。
    solution: >
      mvopsd_reward.py 在 sibling import 前插入自身目录（沿用仓库既有写法）。
      验证方式不是"文件能 import"，而是**复刻 verl 的加载链**：
      `PYTHONPATH=verl_pkg:. python3 -c "load_extern_object('./scripts/opsd/mvopsd_reward.py','compute_score')"`
      并对 cvbench / 训练集两类 data_source 各打一次分，四个用例返回值正确；
      `test_cvbench_val_parity.py` 全绿（含 2638/2638 prompt 逐条匹配）。
      清理两机失败产物后于 22:04 重启，两机均越过该失败点进入 step 0 验证。
    prevention: >
      1) 任何由框架"按文件路径"加载的模块（reward、custom dataset、custom loss）
         不能依赖 cwd 或 PYTHONPATH 来解析同目录导入，必须自己把所在目录加进 sys.path。
      2) 改完这类模块后，验收标准是**用框架自己的加载器加载一次**，而不是在项目根
         `import` 一下就算过——后者的 sys.path 与 Ray worker 不同，测不出这个故障。
      3) 这是 ISSUE-103 的同族问题：共享代码在两次 run 之间被修改，而其间没有新 run
         去暴露它。凡是训练链路上的文件被改动过，下一次正式启动前应先跑一次 SMOKE。
         本次没跑 smoke，是靠 fast-failure guard 兜住的。

