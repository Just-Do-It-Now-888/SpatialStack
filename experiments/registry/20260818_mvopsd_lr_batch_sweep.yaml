  summary: >
    主假设成立、次假设被证伪：**LR 与 batch 只改变到达平台的轨迹，不移动终点。**
    - LR：把谷底从 step 30 提前到 step 15，但 JSD 平台随 LR 单调抬高
      （0.0155 → 0.018 → 0.021），护栏渐近线不动。方向被否掉，后续回到 5.0e-6。
    - batch：加倍后 grad_norm 与 JSD 平台都略降（方差缩小，符合预期），但对护栏
      渐近线的影响在两个 LR 上**符号相反**（+0.85 / −2.22pp），落在单种子噪声内，
      不构成可复现收益，而墙钟严格翻倍。后续沿用 batch 64。
