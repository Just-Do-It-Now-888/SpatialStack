experiment_id: 20260818_mvopsd_lr_batch_sweep
title: "MV-OPSD LR x batch 扫描：4 条 arm，两机各串行 2 条"
status: completed  # planned | running | completed | failed | cancelled

created_at: "2026-08-18T21:57:00+08:00"
finished_at: "2026-08-19T23:16:00+08:00"
owner: "cursor-window-mvopsd"

goal: >
  v1（batch 64 / lr 2.0e-6）与 rollout8（batch 64 / n=8 / lr 2.0e-6）都收敛到一个
  低于自身基座约 4 分的 CV-Bench 渐近线，且 JSD 平台值都停在 0.0157（ln2 的 2.3%）。
  用户判断模型可能欠拟合，提出提高 LR 与增大 batch。本扫描在这两个维度各取两个点，
  回答一个具体问题：**这两个旋钮能否移动渐近线与 JSD 平台，还是只改变到达平台的轨迹。**

grouping_rationale: >
  四条 arm 是四个不同的模型设定，本应各有 experiment_id；此处合并为一个 registry
  是因为它们共享同一份假设、同一套判读标准与同一次分析，拆开会让对照关系散落。
  每条 arm 有独立的 arm_id、实验名与产物路径，训练与评测都留在本文件内。

hypothesis: >
  主假设（来自已有证据，倾向于被证伪）：渐近线由 student 与 teacher 的视角信息落差
  决定，是结构性下界，因此提高 LR 与增大 batch 只会更快到达同一平台。
  次假设（用户提出，本扫描要测的）：当前 lr 2.0e-6 / batch 64 下模型尚未充分优化，
  加大后渐近线上移。
  第三种可能（必须留出）：提高 LR 会加深 step 30 附近的谷底——v1 的谷底恰好出现在
  warmup 结束（step 10）之后 20 步，LR 已经被怀疑与损伤有关。

