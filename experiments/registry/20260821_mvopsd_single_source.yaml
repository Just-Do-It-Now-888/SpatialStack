    已核对 Vision-OPD 与当前实现：VOPD 只在 response_mask 标记的 Student 生成 token 上
    计算，不蒸馏 prompt / image token / prompt 内 thinking 标记；Teacher 对同一条
    Student response 做 teacher forcing。代码没有 answer-only mask，因此 response 中的
    逐帧分析与最终答案等权进入 loss。该范围与 Vision-OPD 相同，不是误把 prompt/image
    纳入 loss 的实现 bug。
  root_cause_assessment: >
    已证实的直接机制是 response-length explosion + truncation。teacher_enable_thinking=True
    让 Teacher 在开放 <think> 上下文中给 Student 的全部 response token 提供推理态 soft target，
    与 Vision-OPD 的双侧 non-thinking 不同，是最高优先级机制假设；但本轮同时改变了数据源、
    rollout.n 与 thinking，缺少单变量对照，不能把它写成已经证明的唯一根因。
