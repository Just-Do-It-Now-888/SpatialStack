experiment_id: 20260821_mvopsd_single_source
title: "MV-OPSD 单数据集训练：teacher<=8 视角、K~U{2,3,4,5}、rollout n=1、lr 2e-6"
status: cancelled  # planned | running | completed | failed | cancelled

created_at: "2026-08-21T16:10:00+08:00"
finished_at: "2026-08-21T23:40:00+08:00"
owner: "cursor-window-mvopsd"

goal: >
  前六轮（v1、rollout8、lr/batch 四条、view_ratio 两条）全部在混合池上训练，而 2026-08-20
  的 teacher 可靠性全量评测把这个池拆开后发现：同一个 teacher 在 llava_hound 上 57.7%、
  在 spar_32view 上 19.9%，题型层面从 57.7% 到 1.3%，相差 40 倍以上
  （20260820_teacher_reliability，报告 2.2/2.3 节）。
  混合池上的每一条曲线都是这些差异极大的监督信号的加权和，而权重是数据量决定的、
  没有人选过。本轮按用户与老师 2026-08-21 的决策，改成**一次只训一个数据集**，
  让「方法在什么质量的监督下成立」变成可读的量。

hypothesis: >
  可检验的表述：若 vopd 自蒸馏的效果由 teacher 后验的正确性决定，那么四条 arm 的
  VSI-Bench 曲线应当按 teacher 可靠性排序（llava_hound 57.7% > vsi_appr_order 55.3%
  > vlm3r_scannet 44.0% > spar_32view 19.9%）。
  若四条 arm 表现一致（都损伤、或都不动），则「监督质量」不是主要变量，
  应转向 LESSON-016/020 指向的另一条解释：损失被与视角无关的散文 token 稀释，
  梯度主要在改写作风格而不在空间能力。
  注意这不是一个「哪个数据集最好」的排名任务——四条 arm 的池大小、题型结构、
  金标形式都不同，**只有「排序是否与可靠性一致」这一条是可读的**。

grouping_rationale: >
  四条 arm 共享同一套配置（除训练池）、同一假设、同一判读标准，合并在一个 registry 里。
  每条 arm 有独立 experiment_name 与产物路径。

step_budget_rule: >
  **步数按「过一遍数据集」定，不套用固定值**（用户 2026-08-21 16:30 决策）。
  每条 arm 的步数 = floor(训练行数 / 64)，即恰好 1 个 epoch：

    llava_hound_64k   37,509 / 64 = 586.08 -> 586 步（余 5 行）
    vlm3r_scannet     30,567 / 64 = 477.61 -> 477 步（余 39 行）
    vsi_appr_order     1,735 / 64 =  27.11 ->  27 步（余 7 行）
    spar_32view       视最终池而定：全截 21,025 -> 328；只留不点名帧 8,974 -> 140；
                      全截并摘掉 imagination_oo 15,155 -> 236

  这样四条 arm 的「每条样本被看过的次数」相同（1 次），而之前统一 300 步会让
  llava_hound 只过 0.51 个 epoch、vsi_appr_order 过 13 个 epoch——
  同一个横轴上并列的两条曲线其实在测完全不同的东西。
  **代价**：横轴不再对齐，586 步的 arm 与 477 步的 arm 在同一步数上已经过了
  不同比例的数据。读图时要按 epoch 比例（step/total）而不是按绝对步数对齐。

wall_clock_budget: >
  实测分量（2026-08-21，来自 khalf_pipecheck 与 khalf_main）：

    全量 VSI-Bench 评测（5,130 题）  1758 / 1762 / 1776 s -> 29.5 min，三次极稳
    存 checkpoint                    12 s，可忽略
    单步（rollout.n=4，256 序列/步）  125 s = update_actor 69 + adv 32 + gen 24
    单步（rollout.n=1，64 序列/步）   预计 35-50 s，本轮首个实测待 step 1 落盘后补

  按 40 s/步估：25 步 = 17 min 训练 + 29.5 min 评测，约 45-50 min 一个周期。
  llava_hound 586 步 ~18 h（训练 6.5 h / 评测 11.8 h）；vlm3r 477 步 ~15 h。

  **评测占约 65% 墙钟**，与前六轮的 3% 完全不同。原因是两件事叠加：
  评测集从 CV-Bench 2,638 题（2.8 min）换成全量 VSI-Bench 5,130 题（29.5 min，贵 10 倍），
  同时 rollout.n=1 让训练步便宜 2.5 倍。29.5 min 不随 rollout.n 变化——
  评测恒为 greedy、val_kwargs.n=1——所以这个比例不会自己好转。
  用户 2026-08-21 16:45 决策：**接受，TEST_FREQ 保持 25 不动**，
  评测点密度优先于墙钟。已评估过的替代方案（TEST_FREQ=50、分层抽样到 1/3、
  评测与存档解耦）均未采纳，不要在后续轮次里当作待办重新提出。

test_freq_rule: >
  两条大 arm 统一 TEST_FREQ=25（而不是各自缩放），因为跨 arm 比较是本轮的全部目的，
  评测点落在同一个步数网格上才能直接对齐：llava_hound 24 个点、vlm3r 20 个点。
  vsi_appr_order 只有 27 步，必须单独用 TEST_FREQ=3（9 个点），
  它的网格与另两条不同——这条 arm 本来就已经是不同口径。
  SAVE_FREQ 与 TEST_FREQ 对齐，每个评测点都有 checkpoint 可供离线复算。

known_limitation: >
  1. **池大小差 20 倍**（37,509 / 30,567 / 1,735 / 待定），所以 1 个 epoch 对应的步数
     从 27 到 586。步数已按 epoch 对齐（见 step_budget_rule），但这意味着
     vsi_appr_order 只有 27 次参数更新，**它测的是「27 步能不能看出方向」，
     不是「方法在这个数据集上的渐近行为」**，与另两条不是同一个问题。
  2. **teacher 可靠性数字是 32/8 视角混合口径**：报告的 per-source 正确率是在
     `main_train.parquet` 的原始视角数下测的（spar_32view 是 32 张）。本轮 teacher 上限 8 张，
     受控扫描显示不点名帧题型 8 张 = 18.4% vs 32 张 = 22.0%，所以 spar_32view 一旦启动，
     其 teacher 可靠性会低于报告的 19.9%。另两条 arm 原本就 <=8 张，不受影响。
  3. **K 与题型仍未完全解耦**：K 从 {2,3,4,5} 逐样本抽，同一数据源内 K 是变量（这是相对
     view_ratio 的改进），但不同数据源的相册长度分布不同（llava_hound 有 6,986 条 N<8），
     所以跨 arm 比较 K 效应仍不合法。

