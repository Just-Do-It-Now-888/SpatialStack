    resolved_at: "2026-08-24T04:18:00+08:00"
    by: "experiments/registry/20260824_teacher_thinking_off.yaml"
    note: >
      **上面那条 root_cause_assessment 保持原样，不修改**——它在当时的证据下是正确的
      表述（标为假设而非结论）。以下是补上单变量对照后的判定。
    verdict: >
      假设成立。只改 `teacher_enable_thinking`（True -> False）、其余与本 arm 逐项相同的
      25 步诊断里，长度爆炸**完全没有发生**：训练侧 response_length/mean 25 步全程
      187.8~233.8 无趋势（本 arm 同期 225.7 -> 821.3），clip_ratio 25 步里 23 步为 0
      （本 arm step 25 为 0.5），验证 resp_tokens 中位保持 4（本 arm 变为 1024）。
      step 25 的 VSI rule_only 52.57 vs 本 arm 20.85，**差 31.72 pp**。
      故 response-length explosion 的主要机制确认为 teacher/student 的 thinking mode
      mismatch，`root_cause_assessment` 里的 diagnosed 可升级为 confirmed。
    still_not_established: >
      thinking=False 只是消除了破坏，**没有产生收益**（53.38 -> 52.57，−0.81 pp / 0.043 epoch）。
      且对照 arm 里出现了一条新的早期信号：验证 resp_tokens 的 p95 从 333 涨到 1024、
      answered/frac 98.23% -> 95.05%，即长尾在变粗而中位数不动。
      因此「teacher 关 thinking」不是本方法的修复方案，只是移除了一个混淆因素。
  decision:
    - "停止 llava_hound 与 vlm3r，不继续到 1 epoch"
    - "vsi_appr_order 与 spar_32view 不启动，先排除共享失效机制"
    - "若继续，优先只做 teacher_enable_thinking=False、其余不变的 25-step 最小诊断"
    - "（2026-08-24 追记）上一条已执行完毕并证实假设，见 root_cause_followup；共享失效机制已排除，另两条 arm 的启动前置条件解除"

issues:
  - id: ISSUE-301
    title: "MRA 阈值与上游差最后几位，训练内 VSI-Bench 系统性低报"
    status: resolved
    found_at: "2026-08-21 一级指标诊断（用户要求查验主指标计算）"
    symptom: "同一批 5,130 行回答，训练内判分 53.62，lmms_eval 53.64"
    evidence: >
      逐行比对定位到 8 行分歧，全部是数值题且预测值恰好压在阈值上
      （1.1 vs 1.0、9 vs 10、1.7 vs 2.0、18 vs 20），分歧方向恒定为我们更低。
      恒定方向是关键特征——真随机的判分噪声会双向抖动。
    root_cause: >
      上游 src/lmms_eval/tasks/vsibench/utils.py:180-184 是
      np.linspace(0.5, 0.95, int((0.95-0.5)/0.05 + 2))，int() 把 10.999999999999998 截成 10，
      个数确实是 10 个；但 numpy 的第 8 个阈值是 0.8999999999999999，1-阈值 = 0.10000000000000009，
      而我们写的 0.5+0.05*i 给 0.9，1-阈值 = 0.09999999999999998。
      「相对误差恰好 0.1」在浮点里是 0.10000000000000009，正好落在两者之间。
    solution: >
      mean_relative_accuracy 收成全仓一份放进 scripts/opsd/vsibench_scoring.py，
      按上游同样的 linspace 构造阈值；mvopsd_reward.py 与 spar_scoring.py 都改为引用
      （原先各写了一份同样的错法）。
    verification: >
      5,130 行逐行 0 分歧，双方 overall 都是 53.6391；
      离线 vLLM 归档那条 parity 从 52.57 vs 52.58 变成 52.58 vs 52.58。
      test_val_metric_invariance.py 另用 6 个压阈值样例直接对比上游。
    blast_radius: >
      一位小数网格上仅 0.042% 的（预测, 金标）组合会变；teacher 可靠性 as_trained
      124,306 行里 127 行变（0.10%），numeric family 均值 39.94 → 39.98，
      总体 <=0.01pp，41.4% 仍是 41.4%。**已发布报告数字不改。**
    prevention: LESSON-024
  - id: ISSUE-302
    title: "check_prompt_lengths.py 对 llava_hound 报假警「do not launch training on this data」"
    status: resolved
    symptom: "llava_hound 池的 4 项检查全部 MISMATCH，工具以「不要在这份数据上启动训练」退出"
    evidence: >
      估计 1012 实测 772，估计 1596 实测 2108——两个方向都有偏差，说明不是数据超限，
      是估计式错了。实测视角尺寸有 11 种：512x288(144 token) 134,104 张、
      512x512(256) 93,340 张、512x384(192) 17,572 张等。
    root_cause: >
      工具硬编码 TOKENS_PER_VIEW=192。SPAR 与 vlm3r 的视角全是 512x384 所以恰好正确，
      而 llava_hound 是视频帧，尺寸不统一。
    solution: "per-view token 数改为从缓存文件头实测（measure_views）"
    verification: >
      修后 llava_hound 两侧都逐行 ok：student max 1332 / 上限 4096，
      teacher max 2108 / 上限 12288。
    prevention: >
      「一个常量在某个数据源上恰好正确」不等于它是常量。工具的自洽检查报错时，
      先判断是数据违规还是估计式违规——本例中偏差有正有负，数据违规不会这样。
  - id: ISSUE-303
    title: "node-B 缺 VSI-Bench 验证集，会在 val_before_train 的第一步失败"
    status: resolved
    symptom: "启动前检查发现 node-B 没有 data/eval/vsibench_verl/"
    root_cause: >
      2026-08-20 的训练内评测链从 CV-Bench 换成 VSI-Bench 时只在 node-A 上建了数据集，
      node-B 上一轮（kquarter arm）跑的是 CV-Bench 评测，所以缺失一直没暴露。
    solution: "rsync 2.0 GB 到 node-B（4 秒，466 MB/s）"
    prevention: >
      run_mvopsd.sh 在 TEST_FREQ != -1 时已经会检查 VAL_FILE 存在并 exit 1，
      所以这个坑不会静默——但它会在启动 30 秒后才炸。跨机启动前先核对数据集清单更省时间。
  - id: ISSUE-304
    title: "PATH 里 miniconda 的 python3 排在系统 python 之前，训练直接 ModuleNotFoundError"
    status: workaround
    symptom: "run_mvopsd.sh 启动后立刻 ModuleNotFoundError: No module named 'numpy'"
    root_cause: >
      训练环境是系统 python3.12 + ~/.local，而 PATH 里
      /home/c30084464/miniconda3/bin 排在 /usr/bin 之前，其 python3 是 3.14.6
      的 conda base env，没有 numpy/torch/verl。
    solution: "启动时前置 PATH=/usr/bin:$PATH（两机都是）"
    prevention: >
      run_mvopsd.sh 里的 python3 是裸调用。若要根治应让脚本显式用 /usr/bin/python3
      或在启动时校验 python3 -c 'import verl'——尚未改，因为不确定用户交互 shell 的 PATH
      是否与此不同。
  - id: ISSUE-305
    title: "单源训练 10~25 步内发生 response-length explosion，VSI-Bench 崩至约 20%"
    status: diagnosed
    found_at: "2026-08-21 Round-1 正式训练"
    symptom: >
      llava_hound step 25 的训练 response mean=821、clip=50%，VSI 53.38% -> 21.92%；
      vlm3r step 15 已 mean=1021.6、clip=98.4%，step 25 VSI 53.36% -> 18.98%。
      后续训练到 step 175 / 100 仍无恢复。
    evidence: >
      全量 VSI 5,130 题的 response median 从 step 0 的 4 token 变为 1024；
      llava_hound 最新验证 97.2%、vlm3r 98.4% 的输出达到 1023+ token。
      输出形态是 Frame/Image 逐项枚举，常在最终答案前被切断。
    root_cause: >
      直接机制已确认是响应长度失控与截断。VOPD 只蒸馏 Student response，不蒸馏 prompt/image；
      但整段 response 等权参与 JSD。Teacher thinking 开、Student thinking 关的 mode mismatch
      很可能把 soft target 推向推理态长文本；尚缺 thinking on/off 单变量实验，状态为 diagnosed
      而非 resolved。
    solution: >
      用户决定提前停止两条正式 run，并暂停另外两条 arm。若重试，先用 llava_hound
      做 teacher_enable_thinking=False 的 25-step 最小诊断；不要直接重启全 epoch。
    prevention: >
      把 step 10/15/20 的训练 response mean/clip_ratio 加入硬性早停观察；
      验证侧同时看 median 与达到 cap 的比例，不能只看 answered/frac 或 VOPD loss。

  - id: ISSUE-306
    title: "HTML 结果查看器把 parquet 的 id 与 index 混成同一个 key，51.4% 的行元数据与帧错位"
    status: resolved
    found_at: "2026-08-23 用户在查看器里追问某题为何判对时暴露"
    symptom: >
      离线评测查看器页面上，题面 / 金标 / 回复 / 分数正确，但题型、场景、index、id
      与 32 帧输入图属于另一道题。例：samples.jsonl 的 id=168（object_size_estimation，
      场景 41069025，金标 173）在页面上显示为 object_abs_distance、场景 42445026，
      并配了 42445026 的帧。
    evidence: >
      build_vsibench_val_viewer.py::parquet_by_id 把 str(extra.id) 与 str(extra.index)
      写进同一个 dict：10,260 次插入只剩 5,155 个 key，跨行覆盖 5,103 次。
      按 samples.jsonl 逐行核对，5,130 行里 2,638 行（51.4%）join 到了错误的 parquet 行。
      key "168" 先由 row 3（extra.id='168'）写入，后被 row 168（extra.index=168）覆盖。
    root_cause: >
      parquet 中 extra.id 是字符串、extra.index 是整数，原生不会撞 key；
      是 parquet_by_id 里的 str() 归一化把两个不同命名空间压成一个，人为制造了碰撞。
      随后 build_sample 的字段优先级是 extra 优先于 dump，于是错误行的元数据覆盖了
      评测记录自带的正确元数据；图片则只能来自 parquet 行，必然跟着错。
    solution: >
      parquet_by_id 改为只按 extra_info.id 建表（已验证 5,130 个 id 全局唯一，
      samples 侧 id 全部命中），重复 id 直接 SystemExit 而不是静默覆盖；
      build_sample 新增 _prefer_dump()，question_type / dataset / scene_name / id
      一律以评测记录为准，parquet 只负责帧路径；新增 meta_ok / meta_conflicts 两列，
      两侧元数据冲突时页面标红并提示“这些帧不属于本题”，筛选框加“元数据错位”一项；
      构建脚本收尾打印错位条数。重建后错位 0/5130，failure 分布
      （3978/937/124/91）与修复前逐项一致，证明判分未被触碰。
    status_note: >
      分数与 summary.json 从未受影响——判分在 vsibench_eval_core 内完成，
      不经过这个 join。受影响的只有查看器的展示层。
    prevention: >
      见 LESSON-028。一张映射表只允许一个命名空间；join 后必须做交叉校验并把
      不一致显式暴露在产物里，不能让展示层静默拼接两个来源。

