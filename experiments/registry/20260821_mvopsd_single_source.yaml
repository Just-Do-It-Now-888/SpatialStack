      用户 2026-08-21 决策「跑完一轮即可」：1,735 / 64 = 27 步 = 1 个 epoch。
      TEST_FREQ 用 3（9 个评测点），沿用 25 的话 27 步内只有 2 个点。
      这条 arm 与 VSI-Bench 的 obj_appearance_order 题型同源，**它的训练集与评测集
      在题型上重叠**，所以它的 VSI-Bench 涨幅不能与另三条同等看待——
      那更接近 in-domain 微调而不是空间能力迁移。这一点在读数时必须写明。
  - arm_id: spar_32view
    experiment_name: null
    node: null
    status: cancelled
    data_source: spar_32view
    teacher_reliability_at_launch: "19.9%（报告 2.2 节，20,525 条）"
    blocked_on: >
      teacher 相册要从 32 张压到 8 张，但 12,051/21,025 条（57%）的题面直接点名
      Frame-N（最多 5 个），这些帧上画着红/蓝标记点。机械层面已解决：
      build_single_source_plans.py 把被点名的帧钉住必留、补随机帧到 8 张、再把题面重编号，
      renumber_frame_refs 找不到映射时抛异常而非留悬空帧号。
      未解决的是证据层面：受控扫描（sweep_spar32）只覆盖 4 个**不点名帧**的题型，
      测出 8 张 = 18.4% vs 32 张 = 22.0%（保住 84%）。点名帧的 4 个题型是距离题，
      需要跨视角三角化——被点名的两帧只标出「是哪两个物体」，算出「相距 2.1 米」要靠
      其余视角重建尺度。从 32 砍到 8 对它们的代价**没有任何数据**。
      用户 2026-08-21 决定「先暂时不测」，等前三条有结论再定。
    tradeoff_measured:
      frame_agnostic_only: {rows: 8974, weighted_teacher_reliability: "19.4%"}
      all_truncated_to_8: {rows: 21025, weighted_teacher_reliability: "19.9%（32 张口径，8 张会更低）"}
      all_minus_imagination_oo: {rows: 15155, weighted_teacher_reliability: "27.1%"}
    counterintuitive_finding: >
      「只保留证据覆盖到的部分」给出**最差**的训练池。近零可靠性的题型
      （spatial_imagination_oo_video_hard 1.5%、oc_video_hard 12.5%）集中在不点名帧那一半，
      而 teacher 最可靠的两个题型（distance_prediction_oo 35.1%、
      distance_infer_center_oo 35.0%）全在点名帧那一半。
      另外 spatial_imagination_oo_* 的 1.3~1.5% 是格式问题不是能力问题（ISSUE-T05）：
      金标要三条轴全对，teacher 只答一条，在它说出口的轴上准确率 68.2%。

relations:
  - kind: depends_on
    experiment_id: 20260820_teacher_reliability
    why: "四条 arm 的选择与排序假设完全来自它的 per-source / per-type 可靠性表。"
  - kind: supersedes_design_of
    experiment_id: 20260820_mvopsd_view_ratio
    why: >
      view_ratio 用「K = N 的固定比例」，把 K 与落差绑死且与数据源绑死。
      本轮改成 K 从固定菜单逐样本抽，同一数据源内 K 才成为变量。
  - kind: comparable_baseline
    experiment_id: null
    why: >
      基座锚点。训练内 VSI-Bench 的 step 0 = **53.62**
      （2026-08-21 诊断，train_20260820_173529.log:6276；判分侧修 ISSUE-301 后重算同一批
      回答为 53.64）。离线 vLLM 52.58、离线 HF/lmms_eval 53.40 是**不同引擎口径**，
      不要拿来当训练内曲线的锚点。

data:
  pools_built_by: scripts/opsd/build_single_source_plans.py
  builder_seed: 20260821
  teacher_view_cap: 8
  k_menu: [2, 3, 4, 5]
  k_draw_rule: >
    逐样本从菜单里均匀抽，约束 max(1, len(required_views)) <= K < len(teacher_views)。
    K 必须严格小于 teacher 的相册（不是小于原始 N），否则截断后落差归零。
    N=4 的样本因此只能抽到 {2,3}，N=5 只能抽到 {2,3,4}——这是相册长度的约束，
    不是抽样偏差，四条 arm 里只有 llava_hound（6,986 条 N<8）与 vlm3r（227 条）受影响。
  pixels_untouched: >
    stage 2 未重跑。本轮只改「两侧各看哪几张已缓存的视角」，
    build_single_source_plans.py 与 build_view_ratio_plans.py 同理。
  holdout_rule: "按场景切 5% 的场景，每源上限 500 条（write_mvopsd_parquet.py 默认）"
  verification:
    view_files_checked: "llava_hound 274,927 张 / vlm3r 9,376 张，unreadable or misaligned = 0"
    student_subset_of_teacher: "两个池逐行校验通过（0 违例）"
    placeholder_image_match: "0 不匹配"
    k_lt_n_le_8: "0 违例"

code:
  new:
    - scripts/opsd/build_single_source_plans.py
  changed:
    - path: scripts/opsd/write_mvopsd_parquet.py
      what: >
        build_row 认 plan 里可选的 teacher_view_indices / teacher_body，
        用于把 teacher 相册压到 N 以下；缺省时行为与 2026-08-21 之前完全一致。
        verify_views 与 report 的 teacher token 统计同步改成只数 teacher 实际看到的视角。
    - path: scripts/opsd/tools/check_prompt_lengths.py
      what: >
        per-view token 数改为从缓存文件头实测，不再硬编码 192。
        见 issues 里的 ISSUE-302。
  unchanged_but_load_bearing:
    - "verl_pkg/verl/trainer/config/mvopsd.yaml：rollout.n=1、lr 2e-6、teacher_enable_thinking=True"

parameters:
  model: models/Qwen3.5-4B
  lr: 2.0e-6
  lr_warmup_steps: 10
  train_batch_size: 64
  ppo_mini_batch_size: 64
  rollout_n: 1
  loss_mode: vopd
  loss_agg_mode: token-mean
  alpha: 0.5
  is_clip: 2.0
  distillation_topk: 100
  teacher_regularization: frozen
  teacher_update_rate: 0.0
  teacher_enable_thinking: true
  student_enable_thinking: false
  validation_enable_thinking: false
  max_prompt_length: 4096
  max_response_length: 1024
  max_reprompt_len: 12288
  test_freq: "25（两条大 arm 同网格）；vsi_appr_order 用 3"
  save_freq: "与 test_freq 对齐"
  val_benchmark: "VSI-Bench 全量 5,130 题 / 32 帧"
  judge: "gpt-oss-120b，vLLM sleep 模式，只对规则读不出的行唤醒"

decision_criteria:
  primary: "val-core/vsibench/overall/acc，与基座锚点 53.62 比"
  supporting:
    - "val-core/vsibench/answered/frac：掉了就说明模型不再输出可读答案，主指标随即失去意义"
    - "val-core/vsibench/resp_tokens/mean：与训练侧 response_length/mean 同单位，长度是退化最早的信号（LESSON-020）"
    - "val-aux/vsibench/resp_tokens/median：均值不动可能掩盖中位数翻倍，反之亦然（基座上 mean 97.1 vs median 3）"
    - "self_distillation/raw_jsd_token_mean：teacher 开 thinking 后平台预期整体上移，冒烟 step 2 = 0.0619（前四条 arm 平台 0.018~0.022）；移位本身不是方法有效或无效的证据"
    - "self_distillation/teacher_probe：frozen teacher 下必须恒定，变了就说明 teacher 在动"
  interpretation_rule: >
    只读「四条 arm 的排序是否与 teacher 可靠性一致」。**不要**读某条 arm 的绝对值
    高于另一条就说该数据集更好——池大小、题型结构、金标形式、epoch 数都不同。
    vsi_appr_order 额外还有训练/评测题型重叠的问题（见该 arm 的 note）。

must_watch:
  - "训练侧 response_length/mean 是否单调上涨：v0/v1 的退化形态是答案变成散文（LESSON-020）"
  - "val-core/vsibench/resp_tokens/mean 与 median 同时看"
  - "self_distillation/policy_fallback_fraction 必须恒为 0：不为 0 说明有样本没拿到 teacher 视角，而配置里 fallback_to_policy_loss_on_missing_teacher=False 本该直接报错"
  - "actor/lr 在第 10 步后应到 2e-6"

