issues:
  - id: ISSUE-102
    status: open  # 已用等效命令绕过；脚本修复待 v1 结束后进行
    phase: smoke
    discovered_at: "2026-08-18T02:48:00+08:00"
    symptom: >
      本 registry 与 ACTIVE.md 记录的 smoke 命令
      `SMOKE=1 ROLLOUT_N=8 ... run_mvopsd.sh main` 并不会以 n=8 运行，
      而是以 n=2 运行。照此执行会得到「smoke 通过」的结论，但完全没有验证
      本实验唯一需要验证的东西（n=8 的显存与墙钟）。
    evidence: >
      run_mvopsd.sh:58 在 SMOKE 分支内是硬赋值 `ROLLOUT_N=2`，
      不是 `ROLLOUT_N="${ROLLOUT_N:-2}"`，会无条件覆盖第 30 行从环境读到的值。
      同一分支的 TRAIN_BATCH_SIZE 用的是 `${SMOKE_BATCH:-8}`（可覆盖），
      对比之下更能看出 ROLLOUT_N 这行是漏写。
    root_cause: >
      SMOKE 分支设计意图是「一切都缩到最小」，加 ROLLOUT_N=8 这种需求出现得晚，
      写 registry 时按 TRAIN_BATCH_SIZE 的可覆盖语义想当然地推断了 ROLLOUT_N。
    solution: >
      本次不改脚本，改为不用 SMOKE=1，直接逐项传脚本本就支持的环境变量：
      `EXPERIMENT_NAME=..._smoke ROLLOUT_N=8 TOTAL_STEPS=2 TRAIN_BATCH_SIZE=64
      TEST_FREQ=1 SAVE_FREQ=-1 VAL_FILE=<cvbench_val_64.parquet>
      run_mvopsd.sh main trainer.resume_mode=disable`。
      顺带把 batch 设为真实的 64（SMOKE 分支会压到 8），使显存与墙钟数据对
      正式跑有参考价值。
    deferred_fix: >
      不在此刻改 run_mvopsd.sh：node-A 上 v1 的 `bash run_mvopsd.sh` 进程仍在运行，
      bash 是按文件偏移分块读脚本的，改动会移动偏移量，进程在当前命令返回后可能
      读到错位内容。等 v1 结束后再把第 58 行改成可覆盖形式并同步两机。
    prevention: >
      registry 里写具体启动命令时，凡是声称「某参数取值 X」的，要回到脚本确认该参数
      在所走分支里确实可被覆盖，而不是从同分支其他参数的写法类推。

