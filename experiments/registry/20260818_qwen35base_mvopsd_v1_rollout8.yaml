experiment_id: 20260818_qwen35base_mvopsd_v1_rollout8
title: "MV-OPSD v1 align：整体对齐 Vision-OPD 配置（rollout.n=8 + token-mean）"
status: running  # planned | running | completed | failed | cancelled

created_at: "2026-08-18T00:30:00+08:00"
finished_at: null
owner: "cursor-window-mvopsd"

goal: >
  在 v1 跑完后，把训练配置**整体对齐 Vision-OPD 官方设置**（rollout.n 4→8，
  loss_agg_mode 回到默认 token-mean），检验 CV-Bench 2D 的下降是否与「相对参考实现
  的偏离」有关。这不是 rollout.n 的单变量消融——见 attribution，此定位为 2026-08-18
  用户决策（选项 A）。
  Vision-OPD 官方为 96 prompts × 8 rollouts = 768 序列/步；本实验保持 batch=64，
  故为 64 × 8 = 512 序列/步（仍低于官方 768，但把每 prompt 的随机样本数对齐到 8）。

hypothesis: >
  v1 相对 Vision-OPD 有两处配置偏离，且两处都可能助长长散文漂移：(a) n=4 时同一
  prompt 的 4 条轨迹更易被长散文主导，n=8 提高短答路径被采样到的概率；(b)
  seq-mean-token-mean 让 1 条 124-token 的 spar_32view 与 1 条 342-token 的
  spar_3view 等权，相对 token-mean 反而**抬高**了短答样本的单 token 梯度方差。
  同时改回官方设置后，CV-Bench 2D 的下降预期减缓。若指标改善，需要后续单变量实验
  才能拆分两者贡献（见 attribution.followup）。
  副作用监控：clip_ratio 可能略升（更多抽签机会顶到 1024），用 wandb 跟踪。

changes_vs_v1:
  - id: rollout_n
    what: "actor_rollout_ref.rollout.n: 4 → 8"
    why: "对齐 Vision-OPD 官方 ROLLOUT_N=8；v1 与 v0 均为 4"
  - id: loss_agg_mode
    what: "actor.loss_agg_mode: seq-mean-token-mean → token-mean"
    why: >
      2026-08-18 改配置，回到 verl 默认与 Vision-OPD 官方设置。原先偏离的理由
      （SPAR 3-view 吃掉 57% 梯度）基于标注答案长度，按 v1 实测 rollout 生成长度
      重算后失衡仅 +10.8pp，前提不成立。见 LESSON-016。
    caveat: >
      这使本实验相对 v1 有两个变量同时变化，rollout_n 的效应不可单独归因；
      已按 attribution（选项 A）把本实验重新定位为整体配置对齐。
  - id: 实验名
    what: "独立 EXPERIMENT_NAME，避免 resume_mode=auto 误续 v1 checkpoint"
    why: "ISSUE-101 同类风险"

attribution:
  status: 已决策（选项 A，2026-08-18，用户确认）
  problem: >
    本实验原设计为「唯一改动 rollout.n」的受控对照，但 loss_agg_mode 改动后与 v1
    存在两处差异，若 CV-Bench 曲线改善，无法区分是 n=8 还是 token-mean 的贡献。
  decision: >
    接受该混淆。两处改动方向一致（都是消除相对 Vision-OPD 官方实现的偏离），
    因此合并为一次「整体对齐」验证更符合当前目的：先确认对齐后 CV-Bench 是否止跌，
    再决定是否值得花算力拆分。不额外消耗算力。
  interpretation_rule: >
    本实验结论只能表述为「整体对齐官方配置后 CV-Bench 的变化」，
    **不得**表述为「rollout.n=8 带来 X 点提升」或「token-mean 带来 X 点提升」。
    报告与 README 引用时须保留这一限定。
  followup: >
    仅在本实验相对 v1 有明确改善时才值得拆分；届时用 rollout.n=4 + token-mean
    单条实验即可分离出 loss_agg_mode 的贡献（与本实验相减得 rollout.n 的贡献）。
    若无改善则两个因素都可排除，无需拆分。

relations:
  follows: 20260817_qwen35base_mvopsd_v1
  inherits: >
    除 rollout.n、loss_agg_mode 与 test_freq/save_freq 外与 v1 相同：数据、seed、
    frozen teacher、batch=64、300 步。test_freq=15（v1 首轮为 5）。
  contrasts:
    v1: "64 × 4 = 256 序列/步；loss_agg_mode=seq-mean-token-mean"
    this: "64 × 8 = 512 序列/步；loss_agg_mode=token-mean"
    vision_opd_official: "96 × 8 = 768 序列/步；loss_agg_mode=token-mean"
    note: >
      本实验与官方仍有 batch 差异（64 vs 96），故为「对齐」而非「复现」。

