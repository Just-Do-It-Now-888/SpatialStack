    solution: >
      qwen2_5vl_monkey_patch.monkey_patch_lr_scheduler_param_groups：
      step 前把 base_lrs / lr_lambdas 裁到当前 optimizer.param_groups 长度。
    prevention: PEFT+ZeRO3 启动后必须看到 step>=1；看见 zip strict 先对 param group 数。
