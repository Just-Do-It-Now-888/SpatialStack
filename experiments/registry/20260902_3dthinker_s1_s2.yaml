  - id: ISSUE-003
    status: resolved
    symptom: Stage2 环境无 flash_attn，官方默认 attn_implementation=flash_attention_2 无法加载
    evidence: 3DThinker-stage2 python 报 ModuleNotFoundError flash_attn；Stage1 也无 flash_attn 但已训完
    root_cause: setup.sh / requirements_stage2 未安装 flash-attn；VLMGRPOTrainer 默认 flash_attention_2
    solution: train_10k.sh 显式 --attn_implementation sdpa
    prevention: 启动前 import flash_attn；没有就改 sdpa 并记入 registry
  - id: ISSUE-002
    status: resolved
    symptom: Stage1 在 0/1560 崩溃 KeyError pixel_values
    evidence: stage1.log main_multi.py:178 assistant_batch['pixel_values']
    root_cause: 发布的 10K 数据 assistant 只有文本 latent，没有图；main_multi 仍走旧的 assistant image collate。官方 main.py 已注释掉这段。
    solution: 把 main_multi collate 对齐 main.py；compute_loss 先 pop 掉 image_out_mask 再 super()
    prevention: 多卡入口改动必须与单卡 main.py 对一下 collate
  - id: ISSUE-001
    status: resolved
    symptom: ranks 1-7 crashed with CUDA invalid device ordinal; only GPU 0 loaded
    evidence: "vggt_rank1.log RuntimeError CUDA error: invalid device ordinal"
    root_cause: "CUDA_VISIBLE_DEVICES=$rank left a single visible GPU, but extract called set_device(rank)"
    solution: always use cuda:0 inside each sharded process
    prevention: never index CUDA devices by shard rank when CUDA_VISIBLE_DEVICES already isolates a card

