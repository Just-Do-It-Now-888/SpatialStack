  - id: ISSUE-007
    status: resolved
    symptom: Stage2 第一次 generate 崩掉，进度停在 0/5000
    evidence: >
      stage2.log 01:55 rank4 IndexError in get_rope_index:
      mask shape [2083] vs indexed tensor [2082]
    root_cause: >
      GRPO trainer 因 gradient checkpointing 设 model.config.use_cache=False。
      generate 每步仍给 attention_mask 追加一列，但不更新 cache_position
      （use_cache 为 false 时跳过）。prepare_inputs_for_generation 用旧的
      cache_position 切片 input_ids，得到长度 P，而 mask 已是 P+1。
      ZeRO3 monkey patch 因 past_key_values.get_seq_length()==0 每步重算
      rope，于是 get_rope_index 用 [2083] 的 mask 去索引 [2082] 的 ids。
    solution: >
      1) modeling_qwen2_5_vl.py get_rope_index：mask 与 ids 长度不一致时裁/补到同长。
      2) 原始 forward 与 qwen2_5vl_monkey_patch.py 在算 rope 前同样对齐 mask。
      不改成 wrap-original-forward（ZeRO3 要求所有 rank 都进 visual() collective）。
    prevention: 启动后必须看到 step>=1 的 loss 才算 Stage2 真正跑起来；见 LESSON-035
