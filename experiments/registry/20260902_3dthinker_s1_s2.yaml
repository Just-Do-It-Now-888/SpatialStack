issues:
  - id: ISSUE-019
    status: resolved
    symptom: >
      计划用 LLaMA-Factory（SFT 环境）合并 Stage2 LoRA 后评测，
      但该路径会静默产出错误模型，两个独立原因。
    evidence: >
      1) SFT 环境是原版 transformers 4.51.1，其 Qwen2_5_VLForConditionalGeneration
         没有 projector_model 属性，基座里那 28 个 projector_model.* 张量
         会被当作 unexpected key 丢弃，不报错。
      2) 基座 tie_word_embeddings=True 且无独立 lm_head（与 embed_tokens 共享张量），
         而 adapter 把 lm_head 列为 LoRA target。
         PEFT 自身警告：tied_target_modules=['lm_head'] 在 merge 时会出问题。
         合并会把输出投影的 LoRA delta 写进共享的输入 embedding。
    root_cause: >
      合并路径依赖的模型类与训练时不同，且绑定权重下的 merge 语义与训练不一致。
    solution: >
      不做离线合并。给 eval/src/inference/utils.py 的 ModelLoader 加分支：
      检测到 adapter_config.json 就按其中的 base_model_name_or_path 加载基座，
      再 PeftModel.from_pretrained 挂载 adapter（不 merge），
      LoRA 只在前向生效，语义与训练完全一致。
      3DThinker-stage1 环境用 pip install --no-deps peft==0.17.1（与训练同版本），
      不触碰已验证的 transformers。
      已验证 adapter 里的 lm_head.base_layer.weight 与基座 embed_tokens 逐位相等，
      挂载不会改变基座数值。
    prevention: >
      跨环境合并 LoRA 前，先确认目标环境的模型类能识别全部自定义张量；
      base 若 tie_word_embeddings=True 且 lm_head 是 LoRA target，一律不要 merge。
  - id: ISSUE-019
    status: open
    symptom: >
      Stage2 GRPO 训练后 MindCube 评测相比 Stage1 基座没有稳定增益，部分维度反而下降。
      最初怀疑是 vLLM 接入引入的实现问题。
    evidence: >
      在 grpo_trainer.py / qwen_module.py 插桩跑 smoke（3~4 步，8 卡 x 8 rollout）：
      (1) H3：6 组 rollout 中有 5 组的 format_reward 与 response_text_reward 在组内
          8 个样本上完全相同（std=0），唯一有差异的是 sim_reward，组内 std 仅
          0.002~0.010；advantage=(r-mean)/(std+1e-4) 把这点差异放大成 ±1.5。
      (2) H6：同一组内 format/response 都相同的情况下，狂刷 413 个 <|latent_end|>
          的补全 sim=0.9082，正常作答的补全 sim=0.7346。
      (3) H10：32 个样本上 extracted_emb 的位置间方差与 sim 完全分离——
          退化补全 pos_var≈0.50~0.63 → cos_sim≈0.80~0.82 → reward≈0.908；
          正常补全 pos_var≈8.7~11.4 → cos_sim≈0.40~0.49 → reward≈0.70~0.74。
      (4) 对照实验：USE_VLLM=False 走原 HF generate 路径，退化完全一致
          （32 个 rollout 中 6 个刷 <|latent_end|>，sim 同为 0.9082）。
      (5) H1/H2/H4/H5 均被否定：vLLM 权重同步正常（sum 每步变化且与 incoming 一致）、
          latent token 查找无 fallback、rollout 8/8 互不相同、分布式 prompt 对齐 48/48 正确。
    root_cause: >
      sim_reward 用 cosine_similarity(decoder_feature, feature_3d).mean() 对 4x1374 个
      patch 求平均，该目标在 decoder_feature 沿位置维度退化为常量时取得最大值——
      常量方向与几乎所有 patch 都有正余弦，而真实多样化的 embedding 只与部分 patch 对齐、
      与其余 patch 失配，平均值反而更低。于是"latent 块塌缩成无信息常量"是 sim_reward 的
      全局最优，构成 reward hacking。叠加 (1)：多数训练步里 sim_reward 是唯一梯度来源，
      每一步都在把策略往 latent 塌缩推，累积数百步后 Stage1 能力被破坏。
      与 vLLM 无关，HF 路径同样存在。
    solution: >
      待定，需要研究层面决策（见 handoff）。候选：对退化 latent 块做门控/置零、
      把 mean-cosine 换成对位置塌缩不敏感的度量、或降低 sim_reward 权重使其不再主导 advantage。
    prevention: >
      连续型辅助 reward 在 GRPO 里必须检查"组内其他 reward 饱和时它是否成为唯一信号"，
      以及"它的全局最优是否对应退化输出"。上线前用 smoke 跑几步，
      打印每个 reward function 的组内 std 与 n_unique。
  - id: ISSUE-018
    status: resolved
    symptom: >
      vLLM 引擎初始化成功后，第一次 generate 就崩：
      ValueError: Attempted to assign 391 x 12 = 4692 multimodal tokens to 9372 placeholders。
      占位符数约为实际视觉 token 的两倍（每图 781 ≈ 391 + 390）。
    evidence: >
      单独验证同一条样本，HF processor 与 vLLM input_preprocessor 结果完全一致
      （prompt_len 1775，image token 1564，每图 391），说明拼装逻辑本身没错。
      进一步实测：调用 processor 前 prompts_text[0] 有 4 个 <|image_pad|>，
      调用后变成 1564 个。
    root_cause: >
      Qwen2.5-VL 的 processor 会**就地改写**传入的 text 列表，
      把每个 <|image_pad|> 展开成每 patch 一个 token。
      trainer 里 prepare_model_inputs 在 _generate_with_vllm 之前调用，
      于是 vLLM 拿到的是已展开的文本，又按自己的规则展开了一次
      （第一个 pad 展成 391，剩下 390 个原样留下 → 781）。
    solution: >
      在 prepare_prompt 之后、prepare_model_inputs 之前用 list(prompts_text) 存一份快照，
      把快照传给 _generate_with_vllm。浅拷贝即可，因为 processor 是重新绑定列表元素。
    prevention: >
      HF processor 对 text 参数不保证无副作用。
      任何需要复用原始 prompt 文本的地方（vLLM、日志、二次分词）都要先自己拷一份。
  - id: ISSUE-017
    status: resolved
    symptom: >
      vLLM V0 引擎起不来：ValueError: No available memory for the cache blocks。
      日志显示 total 95.08GiB x 0.28 = 26.62GiB，
      model weights 7.15GiB，activation peak 27.46GiB，KV Cache 剩 -8.13GiB。
    evidence: >
      同样参数在 V1 引擎下能分到 365,872 token 的 KV cache。
      把 limit_mm_per_prompt 从 8 降到 4、max_model_len 从 16384 降到 8192 后，
      activation peak 从 27.46GiB 降到 14.07GiB，KV 变成 5.27GiB。
    root_cause: >
      V0 的 determine_num_available_blocks 用 total*util - peak_memory 反推 KV，
      而 profile_run 会按 max_model_len 和 limit_mm_per_prompt 的**上限**跑一次前向。
      limit_mm_per_prompt 当时写死 8 张图，但 10k 数据每条最多 4 张（实测 2/3/4 分布），
      等于按两倍真实规模去估显存。V1 的显存核算方式不同，所以没暴露。
    solution: >
      limit_mm_per_prompt 改成 {"image": 4}；vllm_max_model_len 12288、
      vllm_gpu_memory_utilization 0.35 → KV cache 11.93GiB，对 4 图 + 2048 补全约 3 倍余量。
    prevention: >
      limit_mm_per_prompt 要按数据集实测上限填，不要凭感觉放大——
      它不是一个"上限保护"，而是直接决定 profiling 的显存开销。
  - id: ISSUE-016
    status: resolved
    symptom: >
      8 卡 torchrun 下 vLLM 初始化卡死 600 秒后报
      "The client socket has timed out after 600000ms while trying to connect to (10.10.10.70, 43437)"，
      整个训练随之失败。单进程冒烟同样参数却正常。
    evidence: >
      日志里 vLLM 打了 "We must use the `spawn` multiprocessing start method"，
      随后 EngineCore 子进程去连一个不存在的 TCPStore。
      超时地址是 vLLM 自建的 store，不是 torchrun 的 master_port 12346。
    root_cause: >
      vLLM 0.8.5 默认 V1 引擎，EngineCore 跑在 spawn 出的独立进程里。
      该子进程继承了 torchrun 注入的 TORCHELASTIC_USE_AGENT_STORE，
      于是 init_process_group 认为该以客户端身份接入 agent store 而不是自建 server，
      连不上就死等。附带问题：V1 把引擎放在另一进程，
      每步同步 LoRA 权重要用的 driver_worker.model_runner.model.load_weights 根本够不着。
    solution: >
      _init_vllm 里设 VLLM_USE_V1=0 走进程内 V0 引擎；
      构造 LLM 期间用 patch.dict 临时清掉 RANK/WORLD_SIZE/MASTER_*/TORCHELASTIC_* 等变量，
      退出后自动还原。配合原有的 get_world_size→1 patch，8 卡训练组对 vLLM 表现为单卡。
      已确认 V0 下 inner model 是 Qwen2_5_VLForConditionalGeneration 且 load_weights 可达。
    prevention: >
      在 torchrun 里内嵌任何会 spawn 子进程的推理引擎时，
      先确认子进程不会继承 TORCHELASTIC_*；
      单进程冒烟通过不代表分布式下能通过，二者必须分别验。
