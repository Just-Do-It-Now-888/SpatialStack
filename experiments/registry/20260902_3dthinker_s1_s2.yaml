  - id: ISSUE-015
    status: open
    symptom: >
      用户要求「单卡 + batch size 1」跑 Stage2。两层都不成立：
      (a) per_device_train_batch_size=1 单卡直接抛 ValueError，启动不了；
      (b) 退到单卡 batch=8 后在 generate 的第一次 prefill 就 OOM，
      单次申请 160,308,396,032 bytes（149.30 GiB），而卡只有 95.08 GiB。
    evidence: >
      (a) grpo_trainer.py:525-532 校验
      `global_batch_size = per_device_train_batch_size * num_processes`，
      **不含 gradient_accumulation_steps**。单卡 batch=1 时它等于 1，
      `possible_values = [n for n in range(2, 2) ...]` 是空列表，
      任何 num_generations 都过不了。
      (b) traceback: grpo_trainer.py:778 generate → generation/utils.py:3317 _sample
      → qwen2_5vl_monkey_patch.py:99 self.visual() → modeling_qwen2_5_vl.py:319
      F.scaled_dot_product_attention。
      日志 stage2_1gpu_oom_batch8.log。
    root_cause: >
      两条独立原因。
      (a) `per_device_train_batch_size` 在这个 trainer 里是 **completion 数不是 prompt 数**。
      compute_loss 做 `rewards.view(-1, num_generations)`（grpo_trainer.py:931），
      一个 micro-batch 必须装下整数个 GRPO 组。batch=1 单卡时组大小退化为 1，
      组内方差恒 0 → 零 advantage，与 ISSUE-014 的 temperature 1e-6 同一个死法。
      所以单卡的唯一合法形式是 per_device_train_batch_size = num_generations。
      (b) Qwen2.5-VL 的 vision tower 吃 **packed 2D 序列**
      （modeling_qwen2_5_vl.py:527 `seq_len, _ = hidden_states.size()`，无 batch 维），
      一个 batch 内所有图像的 patch 拼成一条长度 S 的序列；
      modeling_qwen2_5_vl.py:313 为它 materialize `[1, S, S]` 的 bool mask。
      S ∝ batch，故 **vision attention 显存是 O(batch²)**。
      反推 sqrt(1.6031e11) → S≈400,387，即每条 rollout 约 50,048 patch：
      8 卡 batch=1 时 S≈50k、mask 2.3 GiB（与实测每卡 24 GiB 相符）；
      单卡 batch=8 时 S≈400k、mask 149.3 GiB。是 64 倍不是 8 倍。
    solution: >
      未解决。已量化的候选（mask 部分按 (batch×50048)² bytes 估，另加模型 25.87 GiB）：
      batch=8 → 149.3 GiB ✗；batch=4 → 37.3 GiB（合计约 63 GiB，可行但紧）；
      batch=2 → 9.3 GiB（合计约 35 GiB，宽松）。
      但 per_device_batch 必须等于 num_generations，所以降 batch 就是降 GRPO 组大小，
      会改变实验语义（组大小 4 或 2 的组内方差估计显著变差）。
      真正的修法是让 vision tower 对同一 prompt 的 8 条 rollout 只算一次再复制 embedding
      ——8 条 rollout 的图像完全相同，现在是算了 8 遍同样的东西。
      这能把 mask 从 (8S)² 降到 S²（64 倍），且不改变实验语义，但要改模型 forward。
    prevention: >
      给 Qwen2.5-VL 这类 packed-vision 模型估显存时，**不能按 batch 线性外推**。
      「decode 是 memory-bound 所以 batch 8 几乎不加钱」只对语言模型成立，
      vision tower 那一段是 O(batch²)。启动前先按 (batch×每条 patch 数)² 算一遍 mask。
  - id: ISSUE-014
    status: resolved
    symptom: >
      两件事同源：(a) 单步 882.91s，5000 步估 51 天；
      (b) reward_std 恒 0.0、loss 0.0、grad_norm 0.0，即 Stage2 不产生任何梯度。
    evidence: >
      stage2.log 首行 warning:
      "generation_config default values have been modified to match model-specific
      defaults: {'use_cache': False, 'temperature': 1e-06, 'repetition_penalty': 1.05, ...}"
      grpo_trainer.py:482 声明 do_sample=True / temperature=1；
      models/Qwen2.5-VL-3B-Instruct/generation_config.json 带 temperature 0.000001，
      Stage1 存权重时继承进 ckpt。
      基线 run（stage2_baseline_nocache_883s.log）step1 reward_std=0.0 grad_norm=0.0。
    root_cause: >
      transformers generation/utils.py:1596-1606 会把「仍等于 GenerationConfig 默认值」
      的字段整体回落到 model.generation_config。trainer 传的 use_cache 未设（默认 True）
      与 temperature=1（默认 1.0）都命中该条件，于是被换成模型侧的 False 与 1e-6。
      use_cache=False 让 336 步解码每步重算整段 ~2100 token（O(n^2)），
      且 ZeRO3 下 generate 开 synced_gpus，8 个 rank 按最长 completion 一起付费。
      temperature=1e-6 让 8 条 generation 几乎相同，组内方差为 0，
      advantages=(r-mean)/(std+1e-4) 全零 → 零梯度。
    solution: >
      kwargs 在该回落之后才应用（utils.py:1613），故在 grpo_trainer.py 的
      generate() 调用点显式传 use_cache=True 与 temperature=1.0。
      训练前反向仍用 model.config.use_cache=False，gradient checkpointing 不受影响。
      实测 882.91 → 120.71（仅 cache）→ 114.27 s/step；
      grad_norm 0.0 → 1.177，reward_std 0.0 → 0.00504。
    prevention: >
      改 GenerationConfig 字段前先看 generate 首个 warning 打了哪些 key 被回落；
      GRPO 类算法启动后必须确认 reward_std>0 且 grad_norm>0，
      只看 loss 会被误导（首步 loss 本就≈0，因为 ratio=1 且 advantages 组内和为 0）。
  - id: ISSUE-013
    status: resolved
    symptom: >
      ISSUE-007 修好后第一次 generate + 三个 reward + optimizer.step 都过了，
      紧接着 lr_scheduler.step() 崩掉，仍停在 0/5000。
    evidence: >
      stage2.log 00:25 rank0-7 ValueError: zip() argument 2 is longer than argument 1
      torch/optim/lr_scheduler.py:296 _update_lr（torch 2.13.0+cu130）
    root_cause: >
      Torch 2.10+ 给 zip 加了 strict=True。DeepSpeed 会丢掉 LoRA 里空的
