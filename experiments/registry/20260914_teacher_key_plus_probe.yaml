owner: cursor-window-mvopsd

goal: >
  在保留 oracle required_views 的前提下，嵌套补 1–10 张相册帧，测量冻结
  Qwen3.5-4B Teacher 准确率随额外帧数的变化。

hypothesis: >
  上一轮 key vs full 显示 32→3.1 帧几乎不掉点（Δ −0.62pp）。若信息瓶颈不在
  关键帧附近的上下文，则 key+1..+10 曲线应接近平坦；若 distance_prediction_oo_video
  的 −7.3pp 来自缺上下文，则该题型应随 extra 上升。
  结果：整体曲线平坦（21.22 → 21.21）；distance_prediction_oo_video 从 28.48 升到 34.84。

