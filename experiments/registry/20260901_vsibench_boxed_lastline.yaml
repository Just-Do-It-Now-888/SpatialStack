issues:
  - id: ISSUE-001
    at: "2026-09-01T20:01:38+08:00"
    symptom: >
      K=1 完成后基座臂无 Model Responding；8 卡利用率高、显存约 1.1GB。
    evidence: >
      日志停在 20:01:38；rank 0 py-spy 在 huggingface_hub dataset_info SSL
      do_handshake；其余 rank 在 accelerate wait_for_everyone。到 21:31 仍未前进。
    root_cause: >
      启动脚本 unset HF_HUB_OFFLINE，lmms-eval download() 仍向 hf-mirror 做
      snapshot_download 元数据握手；镜像卡住时不会回落到本地 cache。
    solution: >
      杀掉 wrapper 1524455 树；HF_HUB_OFFLINE=1 HF_DATASETS_OFFLINE=1
      TRANSFORMERS_OFFLINE=1 只重跑基座（MASTER_PORT=29522）。K=1 产物未动。
    status: resolved
    prevention: >
      缓存已齐且 Hub 不可达时评测走离线；超过数分钟无 Model Responding
      就查 rank 0 是否在 dataset_info，不要空等。见 LESSON-003 反向条。

