issues:
  - id: ISSUE-702
    at: "2026-09-07T14:50:00+08:00"
    symptom: >
      为了在 node-A 上跑冻结初始化的可恢复性探针，vLLM 死在
      `ImportError: libcudart.so.12: cannot open shared object file`。
      我的处置一路升级：先补 transformers/regex/qwen-vl-utils（ISSUE-701，正当），
      再把 node-B 整个 `~/.local/lib/python3.12/site-packages` rsync 覆盖到 node-A。
      此后接连炸出 `pydantic-core 2.33.2 与 pydantic 2.12.5 不匹配`、
      scipy `All ufuncs must have type numpy.ufunc`，最后连
      `pd.read_parquet` 都报 `Cannot convert numpy.ndarray to numpy.ndarray`。
      node-A 从「缺几个包」变成「连读 parquet 都不行」。
    evidence: >
      node-A 系统层自洽但不完整：`PYTHONNOUSERSITE=1` 下 numpy 2.1.0 /
      torch 2.10.0a0+nv25.11 CUDA 13.0 / pandas 2.3.3 / pyarrow 22.0.0 全部可 import，
      但 transformers 与 vllm 都 ModuleNotFoundError（二者本就只装在 `~/.local`）。
      `~/.local` 现为 12 GB 的 node-B 移植品，其包针对 numpy 1.26 编译，
      与系统层针对 numpy 2.1 编译的 sklearn/pyarrow ABI 冲突。rsync 是覆盖式的，无备份。
      对照：node-B 未被改动，vllm 0.18.0 / torch 2.10.0+cu128 / 8 卡全部正常。
    root_cause: >
      两层错误。表层是技术判断：把「补回镜像重建时丢失的包」升级成「整体移植另一台机器的
      site-packages」，而 `~/.local` 只覆盖 user site，dist-packages 仍是 node-A 的，
      于是造出一个两机系统层混合、按 numpy 1.26 与 2.1 双标准编译的环境。
      深层是目标错位：探针要求两条 arm 的数字可比，本就必须同引擎同库测，
      正确解法从一开始就是把两个 checkpoint 放到同一台机器；node-A 根本不需要跑 vLLM。
      我被「让当前这条命令跑通」牵着逐层下钻，没有退回去问这一步的目的，
      于是为一个不存在的需求做了破坏性改动——而该改动本身正是它声称要消除的跨机差异。
    solution: >
      停止在 node-A 上做环境手术。两条 arm 全部改在 node-B 跑：代码、
      plan_mindcube_k1 + main_train.parquet、views/mindcube（2,785 文件）、
      两份 val parquet、arm A 的 checkpoint-314（9.7 GB，--exclude 'global_step*'）
      均已同步；node-B 上重跑 MindCube 测试 40 passed / 7 skipped；
      探针在 node-B 端到端跑通。node-A 的 `~/.local` 待用户裁决（移走留证据 / 重建 / 保留）。
    status: mitigated
    prevention: >
      1. 环境修复的正当范围只有「把外部事件弄丢的东西按原版本补回」。
         一旦动作扩大到覆盖整个 site-packages、跨机移植、或改动未丢失的包，
         那是改变实验基线，必须先停下来问，不能作为调试的下一步顺手做掉。
      2. user site 只能遮蔽 dist-packages 而不能替换它。只要两机 dist-packages 不同，
         「同步 ~/.local」就得不到相同环境，只会得到按两套 numpy ABI 混编的第三种环境。
         要复现另一台机器的环境应当用独立 venv（不继承系统层），而不是覆盖 `~/.local`。
      3. 覆盖式 rsync 到 site-packages 之前先 `mv` 留备份，否则失败不可回滚。
      4. 报错驱动的修复要设深度上限：同一目标上第二次出现新的 ABI/版本冲突，
         就说明在拼装不自洽的环境，应退回重新审视目标而不是再补一个包。
      5. 需要跨机可比的测量，把两个被测对象搬到同一台机器，
         永远优于把两台机器的环境修成一样——前者是数据搬运，后者是不可复现的环境改造。

  - id: ISSUE-701
    at: "2026-09-07T12:40:00+08:00"
    symptom: >
      在 node-A 上跑 check_mvopsd_geometry.py 直接死在
      `ModuleNotFoundError: No module named 'transformers'`；补上后又死在
      `TypeError: fetch_image() got an unexpected keyword argument 'image_patch_size'`。
    evidence: >
      `/usr/bin/python3 -c "import importlib.util as u; print(u.find_spec('transformers'))"`
      → None，而 vllm / verl / torch / datasets / tokenizers 都在。
      同一探针在 node-B 上返回 ~/.local 的 transformers 5.5.0。
      两机 `pip list` 对比有 100+ 行差异：torch 2.10.0a0+nv25.11 / CUDA 13.0（A）
      对 2.10.0+cu128（B），numpy 2.2.6 对 1.26.4，triton 3.3.0 对 3.6.0，
      qwen-vl-utils 0.0.11 对 0.0.14。而 20260901 的 SPAR3 run 日志里 node-A
      记录的是 transformers 5.5.0——说明那份环境不是现在这份。
    root_cause: >
      node-A 的 DSW 系统镜像被重建过（NGC nv25.11 / CUDA 13.0），`~/.local` 里的
      transformers 5.5.0 与匹配的 regex 一起消失，qwen-vl-utils 退回 0.0.11。
      conda 环境活在家目录所以完好（SFT 轮用的 spatialstack-qwen35 / transformers 5.3.0
      不受影响），但 OPSD 训练用的正是「系统 python3.12 + ~/.local」这一套（LESSON-007），
      于是它整套坏了。第二个报错是同一个根因的下游：本仓 verl 的 process_image 调用
      fetch_image 时传 image_patch_size，那是 0.0.14 才有的签名。
    solution: >
      从 node-B rsync 同一份 transformers 5.5.0（含 dist-info），
      再 `pip install --user --no-deps regex==2026.2.19 qwen-vl-utils==0.0.14`
      （必须 `env -u PIP_CONSTRAINT`，全局 constraint 会把版本按回去）。
      修复后 transformers / regex / AutoProcessor / verl process_image 全部可用，
      几何门禁 400 样本通过。
    status: resolved
    prevention: >
      1. 跨机实验开工前先跑一次两机 `pip list` 对比，而不是假设两台一致——
         DSW 实例的系统镜像会在重启时变，只有家目录是持久的。
      2. 「能不能 import」不够，要连**版本与路径**一起打印（LESSON-026 已写过，
         这次是同一课的第二次学费：这回不是版本被遮蔽，而是整个包消失）。
      3. 依赖的**函数签名**也要探。transformers 装上了但 qwen-vl-utils 太老，
         第一层探针会给出「环境已修好」的假绿灯。
      4. 本轮把「每台机器 step-0 必须复现自己的 SFT 锚点」列为硬门禁，
         正是为了让这类残余环境差异在读曲线之前暴露。

