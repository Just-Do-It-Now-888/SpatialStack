    at: "2026-09-19T14:12:30+08:00"
    symptom: "blink_spatial lastline missing results rc=0 on steps 450/600/1100"
    evidence: "FileNotFoundError: Directory cache/datasets/BLINK-Benchmark__BLINK/Spatial_Relation not found; DONE fail=1"
    root_cause: >
      BLINK yaml 用 load_from_disk 相对项目 cache/，不走 HF hub。清盘后只 rsync 了
      ~/.cache/huggingface，CV/SPAR 能 offline 命中，BLINK 不能。
    solution: "rsync Spatial_Relation / Relative_Depth / Multi-view_Reasoning from node-C; rerun driver (CV/SPAR skip)"
    status: resolved
    prevention: "评测启动前检查 cache/datasets/BLINK-Benchmark__BLINK 三子集，不能只查 HF hub。见 LESSON-043。"

