goal: >
  在 SpatialStack geo 权重上重跑 SPAR 全量（spar_3view + spar_32view）1 epoch
  MV-OPSD。Teacher 32 / Student 16（3-view 则为 3/3）。checkpoint 保留策略改为
  训练内 greedy sub480 `val-core/vsibench/overall/acc` 历史最高的 3 个，而不是
  最近 3 个。

hypothesis: >
  终步或最近几步不一定是 in-loop VSI 最高点。按历史最优保留 3 个 FSDP ckpt，
  离线 merge 才能对准曲线峰。配方与 20260915 greedy 重跑相同，只改 retention。

relations:
  init_from: 20260909_spatialstack_qwen35_geo
  follows:
    - 20260915_spatialstack_mvopsd_spar_t32_s16
  engine: hf_generate

code:
  git_commit: b6eeb00
  git_dirty: true

environment:
  conda_env: sr_opsd
  nodes: [node-A]
  gpus_per_node: 8
  gpu_type: H20

model:
  backbone: Qwen3.5-4B + VGGT geometry fusion
  model_path: output/spatialstack_qwen35_train
  geometry_encoder: VGGT-1B
  geometry_encoder_path: models/VGGT-1B
  teacher: frozen
  thinking: false

design:
  data_sources: [spar_3view, spar_32view]
  view_budget:
    spar_32view:
      teacher: 32
      student: 16
      student_rule: required_views union farthest-point extras; empty required pins frame 0
    spar_3view:
      teacher: 3
      student: 3
      note: "N/K=1; no view privilege"
  parquet: data/mvopsd/parquet_spar_t32_s16/main_train.parquet
  train_rows: 54495
  holdout_rows: 1000
  train_by_source: {spar_3view: 33970, spar_32view: 20525}
  total_steps: 1135
  epochs: 1.0
  train_batch_size: 48
  test_freq: 50
  save_freq: 50
  max_actor_ckpt_to_keep: 3
  ckpt_keep_mode: best
  ckpt_keep_metric: val-core/vsibench/overall/acc
  shared_protocol:
    - "ROLLOUT_NAME=hf"
    - "lr 2e-6 / batch 48 / rollout.n=1 / frozen teacher"
    - "teacher_enable_thinking=False"
    - "VAL_FILE=vsibench_val_boxed_lastline_sub480.parquet"
    - "VAL_DO_SAMPLE=0 greedy"
    - "JUDGE=0"
    - "WANDB_MODE=online project=MV-OPSD"
    - "ckpt_keep_mode=best (not FIFO recency)"

wandb:
  mode: online
  project: MV-OPSD
  run_name: 20260918_spatialstack_mvopsd_spar_t32_s16
