    model: output/spatialstack_qwen35_train
    model_impl: qwen3_5
    frames: 32
    disable_thinking: true
    hf_offline: true
    engine: huggingface_lmms_eval
    arms:
      boxed:
        VSIBENCH_PROTOCOL: spatialstack
        max_new_tokens: 4096
        comparable_base: 48.06
      plain:
        VSIBENCH_PROTOCOL: spatialstack_plain
        max_new_tokens: 1024
        comparable_base: 52.75
