        comparable: "paper/upstream 16-token (e.g. 64.24 / 67.65); not 66.59/66.63"
    note: >
      VGGT 几何塔不能走 vLLM。boxed / plain / lmms_legacy 三口径不可并列对减，
      也不可与 vLLM 52.81/47.31 并列。
