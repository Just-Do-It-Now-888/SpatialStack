goal: >
  对发布基座 models/Qwen3.5-4B 分别用 BLINK original（句首字母）
  和 spatialstack（VSI boxed last-line）评 blink_spatial val。
  与 SPAR3 K=1 step 55 的 13.05 / 68.92 对照。两套 dump 分目录。

model: models/Qwen3.5-4B

protocol:
  launcher: scripts/evaluation/eval.sh
  conda_env: sr_opsd
  benchmark: blink_spatial
  split: val
  decoding: greedy
  max_new_tokens: 1024
  disable_thinking: true
  model_impl: qwen3_5
  hf_offline: true

arms:
  original:
    BLINK_PROTOCOL: original
    output_root: logs/eval/20260902_qwen35base_blink_spatial_original
    results_json: logs/eval/20260902_qwen35base_blink_spatial_original/blink_spatial/models__Qwen3.5-4B/20260902_123448_results.json
    status: done
    blink_spatial_macro: 75.30
    blink_multi_view_reasoning: 55.64
    blink_relative_depth: 81.45
    blink_spatial_relation: 88.81
  spatialstack:
    BLINK_PROTOCOL: spatialstack
    VSIBENCH_BOXED_PRIMARY: "1"
    until: []
    output_root: logs/eval/20260902_qwen35base_blink_spatialstack
    results_json: logs/eval/20260902_qwen35base_blink_spatialstack/blink_spatial/models__Qwen3.5-4B/20260902_123529_results.json
    status: done
    blink_spatial_macro: 65.99
    blink_multi_view_reasoning: 36.09
    blink_relative_depth: 81.45
    blink_spatial_relation: 80.42

vs_spar3_k1_step55:
  original: {base: 75.30, spar3: 13.05, delta: -62.25}
  spatialstack: {base: 65.99, spar3: 68.92, delta: +2.93}
  note: >
    original 上 SPAR3 崩盘是格式：基座还能把选项字母放在句首，
    SPAR3 写 CoT（To determine / Based on）。spatialstack 才是可比能力口径，
    SPAR3 略高于基座。

comparability:
