experiment_id: 20260829_mvopsd_llava_hound_epoch1_nothink
title: "llava_hound 完整 1 epoch（586 步）：teacher non-thinking + boxed_lastline 验证"
status: cancelled  # planned | running | completed | failed | cancelled

created_at: "2026-08-29T01:37:00+08:00"
started_at: "2026-08-29T01:37:29+08:00"
