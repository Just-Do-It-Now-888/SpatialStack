goal: >
  在 node-C 上用 SpatialStack geo 权重、仅 llava_hound_64k 跑 1 epoch MV-OPSD。
  Teacher 看该条全部抽帧，Student 看一半（linspace，无 oracle 关键帧）。正式训练 wandb online。

hypothesis: >
  视频源没有 Frame-N / marker 关键帧；N→N/2 仍保留特权间隙。只相对本臂 step 0；
  不可与 VLM-3R T8/S4（钉 0 + farthest 固定 4）当作同一 Student 规则对减。

