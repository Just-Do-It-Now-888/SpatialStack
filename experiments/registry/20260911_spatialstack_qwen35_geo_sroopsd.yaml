training:
  status: completed
  entrypoint: scripts/train/train.sh
  command: |
    source ~/miniconda3/etc/profile.d/conda.sh
    conda activate sr_opsd
    HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 \
    MODEL_PATH=$PWD/models/Qwen3.5-4B \
    USE_GEOMETRY_ENCODER=True \
    GEOMETRY_ENCODER_PATH=$PWD/models/VGGT-1B \
    FEATURE_FUSION_METHOD=deepstack_language_add \
    GEOMETRY_ENCODER_LAYERS="11 17 23" \
    GEOMETRY_FUSION_LAYERS="0 1 2" \
    DATA_FLATTEN=False \
    OUTPUT_DIR=./output/spatialstack_qwen35_train_sroopsd \
    bash scripts/train/train.sh
  parameters:
    seed: 0
    learning_rate: 1.0e-5
    total_batch_size: 64
    per_device_train_batch_size: 1
    world_size: 8
    gradient_accumulation_steps: 8
    epochs: 1
    save_steps: 1000
    max_length: 12800
    feature_fusion_method: deepstack_language_add
    geometry_encoder_layers: [11, 17, 23]
    geometry_fusion_layers: [0, 1, 2]
    use_geometry_encoder: true
    data_flatten: false
    use_vggt_image_preprocess: true
    deepspeed: scripts/zero2_opt.json
  artifacts:
    output_dir: output/spatialstack_qwen35_train_sroopsd
    driver_log: logs/train/20260911_spatialstack_qwen35_geo_sroopsd/driver.log
    smoke_log: logs/train/20260911_spatialstack_qwen35_geo_sroopsd/smoke.log
  results:
