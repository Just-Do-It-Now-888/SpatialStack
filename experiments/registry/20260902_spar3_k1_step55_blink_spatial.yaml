    at: "2026-09-02T11:42:01+08:00"
    symptom: >
      lmms-eval 在 load_from_disk 后立刻失败：Dataset 没有 .copy()。
    evidence: >
      nohup.out AttributeError: 'Dataset' object has no attribute 'copy'
      （task.py:1066）。本地 BLINK 子任务是单 split Dataset（val，133/124/143 条），
      不是 DatasetDict。9/1 blink_spatial 空目录同源。
    root_cause: >
      load_from_disk 返回 Dataset 时，download() 仍按 DatasetDict 迭代 split。
    solution: >
      若 loaded 是 Dataset，包成 DatasetDict({test_split or val: loaded})。
    status: resolved
    prevention: >
      本地 dump 后断言 keys() 含 val/test；评测启动后数分钟无 Model Responding
      先查 download 而不是等 NCCL abort。

