    SMOKE=1 bash scripts/opsd/run_answer_opsd.sh
    setsid nohup bash scripts/opsd/run_answer_opsd.sh
      > logs/train/20260919_spatialstack_answer_opsd_spar_fullviews/train.nohup.log 2>&1
  parameters:
    seed: 20260919
    learning_rate: 2.0e-6
    total_batch_size: 48
    epochs: 1.0
    teacher_prompt_mode: answer_hint
  artifacts:
