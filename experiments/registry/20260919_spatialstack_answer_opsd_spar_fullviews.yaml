experiment_id: 20260919_spatialstack_answer_opsd_spar_fullviews
title: "SPAR equal-view Answer-OPSD: full album both sides, teacher gets GT answer"
status: running

created_at: "2026-09-19T16:35:00+08:00"
started_at: "2026-09-19T16:42:45+08:00"
driver_pid: 2890470
train_pgid: 2890470
python_pid: 2890519
train_log: logs/train/20260919_spatialstack_answer_opsd_spar_fullviews/train_20260919_164245.log
owner: cursor-window-spatialstack

goal: >
  在 SpatialStack geo 权重上跑 SPAR 全量（spar_3view + spar_32view）1 epoch
  Answer-OPSD。Student 与 Teacher 都看完整相册（32/32 与 3/3），只给 Teacher
  拼接 ground-truth 答案（teacher_prompt_mode=answer_hint）。对照轴是
  20260918 SPAR T32/S16 的视图特权，而不是再叠一层 N>K。

hypothesis: >
  原版 OPSD 的答案特权在等视图空间数据上能提供稳定 teacher target。
  SPAR GT 多为短段落/选项，特权弱于 AIME 题解；需同时看 in-loop VSI
  与 Hint/GT 泄漏，不能只看 vopd_loss 下降。

relations:
  init_from: 20260909_spatialstack_qwen35_geo
  follows:
    - 20260918_spatialstack_mvopsd_spar_t32_s16
  method_paper: literature/papers/opsd.md
  contrast: "T32/S16 = view-count privilege, no answer; this arm = answer privilege, N=K"

code:
  git_commit: b6eeb00
  git_dirty: true

environment:
  conda_env: sr_opsd
  nodes: [node-A]
  gpus_per_node: 8
  gpu_type: H20

model:
  backbone: Qwen3.5-4B + VGGT geometry fusion
  model_path: output/spatialstack_qwen35_train
  geometry_encoder: VGGT-1B
  geometry_encoder_path: models/VGGT-1B
  teacher: frozen
  thinking: false
  teacher_prompt_mode: answer_hint

design:
  data_sources: [spar_3view, spar_32view]
  view_budget:
    spar_32view:
      teacher: 32
      student: 32
      student_rule: full album, original Frame-N, no subset
    spar_3view:
      teacher: 3
      student: 3
      note: "N/K=1; only added privilege is the teacher answer hint"
  privilege: "answer_hint on teacher; student prompt has no GT"
  answer_note: >
    SPAR ground_truth is often a short paragraph or option, not an AIME-style
    full solution. Template is the existing answer_hint_template.
  parquet: data/mvopsd/parquet_answer_opsd_spar_fullviews/main_train.parquet
  plan: data/mvopsd/plan_answer_opsd_spar_fullviews
  train_rows: 54495
  holdout_rows: 1000
  train_by_source: {spar_3view: 33970, spar_32view: 20525}
  total_steps: 1135
  epochs: 1.0
  train_batch_size: 48
  test_freq: 50
  save_freq: 50
  max_prompt_length: 12288
  max_actor_ckpt_to_keep: 3
  ckpt_keep_mode: best
  ckpt_keep_metric: val-core/vsibench/overall/acc
  shared_protocol:
    - "ROLLOUT_NAME=hf"
    - "lr 2e-6 / batch 48 / rollout.n=1 / frozen teacher"
    - "teacher_prompt_mode=answer_hint"
    - "teacher_enable_thinking=False"
    - "fallback_to_policy_loss_on_missing_teacher=False"
    - "data.max_prompt_length=12288 (SPAR 32-view student)"
    - "VAL_FILE=vsibench_val_boxed_lastline_sub480.parquet"
    - "VAL_DO_SAMPLE=0 greedy"
    - "JUDGE=0"
    - "WANDB_MODE=online project=MV-OPSD"
    - "do not change mvopsd.yaml default teacher_prompt_mode=null"

wandb:
  mode: online
  project: MV-OPSD
  run_name: 20260919_spatialstack_answer_opsd_spar_fullviews
  url: ""
  run_id: ""

read_rules:
  - "只相对本臂 greedy step 0 与 20260918 T32/S16 greedy in-loop"
  - "不可与 geo boxed 66.59 并列"
  - "泄漏率与准确率必须一起报"

