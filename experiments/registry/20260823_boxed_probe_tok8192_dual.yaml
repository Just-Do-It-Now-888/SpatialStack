           20,480 token 请求并发上限 477x，8 卡满载生成中。"

issues:
  - id: ISSUE-403
    status: resolved
    symptom: "vLLM 在基座模型初始化阶段退出，双模型评测均未完成。"
    evidence: >
      8 张 GPU 启动时每张仅余 10.95/95.08 GiB，而 vLLM 按 0.9 利用率要求
      85.58 GiB；日志报 Free memory ... is less than desired GPU memory utilization。
      11:46 排查发现 VLLM::EngineCore 与 VLLM::Worker_TP0-7 共 9 个进程已运行
      10h23m、父进程为 PID 1，正好对应 01:26 启动、01:30 被强制停止的训练池评测。
      nvidia-smi 报的 PID 620900-620907 是这些进程在宿主命名空间下的编号，
      因此在本容器里查不到，最初被误判为其他容器占用。
    root_cause: >
      强制停止驱动脚本只杀掉了启动器进程，vLLM 的引擎与 8 个 worker 被 init 收养后
      继续持有全部显存，且利用率为 0%，从占用曲线上看不出是活跃任务。
    solution: "kill 掉这 9 个孤儿进程，8 卡显存立即归零，随后重启评测成功。"
    prevention: >
      驱动新增两道防护：每个 arm 启动前检查最小空闲显存（MIN_FREE_MIB，默认 88000），
      不足则写明状态后退出；以及 EXIT/INT/TERM 上 reap 掉 VLLM::EngineCore 与
      VLLM::Worker_TP，使强制停止不再留下占卡的孤儿进程。
  - id: ISSUE-404
    status: resolved
    symptom: "手工在 conda sr_opsd 里跑 VSI 评测时，import vllm 直接抛 pydantic 版本错误。"
    evidence: >
      ~/.local 下的 pydantic-core 2.46.4 与其 pydantic 要求的 2.41.5 不匹配，
      而 ~/.local 会遮蔽 conda 的同名包；报错栈全部落在 ~/.local/.../vllm/。
    root_cause: >
      驱动原先在顶层 unset PYTHONNOUSERSITE 让用户目录可见，注释里的理由是归档数字
      来自能看到用户目录的交互式 shell。但归档两轮的 run.log 实际解析到的是 conda 自带的
      transformers 5.3.0 与 vllm 0.18.0，说明当时用户目录并未生效，注释与事实不符。
    solution: "VSI 侧子 shell 内显式 export PYTHONNOUSERSITE=1，只用 conda 环境。"
    prevention: >
      两轮解析结果已逐行核对一致，且每次运行都把版本与路径打进 run.log；
      训练池侧仍需用户目录（系统 python + ~/.local），因此只在 VSI 子 shell 内固定。
