  eval_env: "miniconda3 envs/sr_opsd（离线 lmms_eval 链才需要）"
  nodes: 1
  gpus_per_node: 8
  gpu_type: "95 GiB / 卡"
  notes: >
    flash_attn 2.7.4.post1+25.11、transformers 5.5.0、torch 2.10.0+cu128、
    vllm 0.18.0、ray 2.53.0。视觉塔必须用 sdpa（LESSON-005）。
    judge 与训练分时共享同样 8 卡，sleep_level 必须为 1（LESSON-014）。

