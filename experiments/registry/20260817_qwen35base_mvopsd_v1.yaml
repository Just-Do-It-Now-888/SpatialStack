training:
  status: running
  entrypoint: scripts/opsd/run_mvopsd.sh
  command: >
    TEST_FREQ=5 EXPERIMENT_NAME=20260817_qwen35base_mvopsd_v1_main
    scripts/opsd/run_mvopsd.sh main
  started_at: "2026-08-17T22:00:01+08:00"
  smoke:
    at: "2026-08-17T21:50:47+08:00"
    config: "SMOKE=1，2 步 / batch 8 / n=2 / TEST_FREQ=1 / 64 条 val / judge 开"
    result: >
      通过。step 0 基座 combined 94.00，step 1 93.997，step 2 93.75，answered/frac 全程 1.0；
      judge/pending 0（规则层读完全部行，judge 未唤醒，符合设计）；
      vopd_loss 0.027 → 0.035；policy_fallback_fraction 恒 0。
    verifications:
      teacher_frozen: >
        self_distillation/teacher_probe 在 step 1 与 step 2 完全相同
        （0.04456961154937744）。这是冻结的结果级证据，不是配置级断言。
      provenance: >
        rollouts/..._smoke/{1,2}.jsonl 每行含 sample_id / source / subset / scene_id /
        k_views_student / n_views_teacher / privilege_bucket / view_selection /
        answer_view_sensitive / uid / data_source；
        wandb 收到 data/step/* 共 20+ 条构成指标，含分数据源的 response_length。
    artifacts: "checkpoints|rollouts|logs 下的 20260817_qwen35base_mvopsd_v1_main_smoke"
  parameters:
    seed: 20260816
    learning_rate: 2.0e-6
    total_batch_size: 64        # 64 prompts x rollout_n 4 = 256 序列/步
    rollout_n: 4
    total_training_steps: 300
    max_prompt_length: 4096
    max_response_length: 1024
    loss_mode: vopd
    # 本次运行的实际取值。注意：2026-08-18 之后 mvopsd.yaml 的默认值已改为
    # token-mean（LESSON-016），因此**重跑 v1 必须显式覆盖回本值**，
    # 否则得到的不是同一个实验：
    #   actor_rollout_ref.actor.loss_agg_mode=seq-mean-token-mean
    loss_agg_mode: seq-mean-token-mean
    alpha: 0.5                  # 广义 JSD 的插值系数，不是 JSD/policy 混合权重（LESSON-012）
    is_clip: 2.0
    distillation_topk: 100
    teacher_regularization: frozen   # v0 是 ema(0.05)；见 changes_vs_v0
    teacher_update_rate: 0.0         # frozen 下被忽略，显式写 0 以免配置读起来像还在跑 EMA
    image_patch_size: 16
    gpu_memory_utilization: 0.35
    vision_attn_implementation: sdpa
    save_freq: 50
    test_freq: 5                # v0 计划值为 10，首轮加密以验证机制稳定
    val_before_train: true
    resume_mode: auto           # 目录为空，等价于从基座冷启动
  in_training_eval:
    benchmark: "CV-Bench 全量 2,638 条，官方 2D/3D combined 聚合"
    points: "step 0（基座对照）、5、10、…、300，共 61 个"
    cost_note: >
      2,638 条 × 61 次不是免费的。若前 20 步确认链路稳定，可改回 TEST_FREQ=10
      以省下约一半的评测墙钟；改动需在此处与 activity_log 中记录实际值。
    generation: "greedy，temperature 0 / do_sample false，与离线协议一致"
    judge: >
      gpt-oss-120b（本地 vLLM，port 8100，sleep level 1），
      只对规则层读不出选项字母且行数 >= min_rows(16) 的情况唤醒。
      失败一律降级为规则分，不影响训练。
    alarms:
      - "val-core/cvbench/answered/frac：格式崩溃告警，跌破 1.0 说明模型开始不给选项字母"
      - "val-aux/cvbench/judge/woken：judge 被唤醒本身就是模型开始跑题的信号"
      - "actor/policy_fallback_fraction：应恒为 0，非 0 说明有样本缺 teacher 视图"
      - "self_distillation/teacher_probe：应逐步恒定，变化即说明 teacher 没有真正冻结"
      - "data/step/source/*/response_length/mean：分数据源的回答长度，散文漂移的早期信号"

  sample_provenance:
    per_row: >
      rollouts/<experiment>/<step>.jsonl 每行新增 sample_id、source、subset、scene_id、
      k_views_student、n_views_teacher、privilege_bucket、view_selection、
      answer_view_sensitive、uid、data_source。
      uid 用于把同一 prompt 的 4 条 rollout 归组。
    per_step: >
      wandb 的 data/step/* ：num_sequences / num_prompts / num_unique_samples、
      source|k_views_student|n_views_teacher|privilege_bucket|view_selection 的构成比例、
      k/n 均值、answer_view_sensitive 比例、分数据源的 response_length 均值
      （reward 非平凡时还会有分数据源的 score 均值）。
    intended_use: >
      当 CV-Bench 曲线出现跳变时，先比对同期的 data/step/* 构成，
      排除「这一段恰好抽到了某个数据源」再讨论方法效应。
  artifacts:
    output_dir: "checkpoints/20260817_qwen35base_mvopsd_v1_main"
    train_log: "logs/train/20260817_qwen35base_mvopsd_v1_main/"
    rollouts: "rollouts/20260817_qwen35base_mvopsd_v1_main"
    validation_dumps: "logs/val/20260817_qwen35base_mvopsd_v1_main"
    wandb: "slcheng/MV-OPSD run 20260817_qwen35base_mvopsd_v1_main"
  results:
    metrics: {}
    summary: ""
    failure_reason: ""

