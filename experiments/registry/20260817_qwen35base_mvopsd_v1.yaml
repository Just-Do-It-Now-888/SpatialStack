experiment_id: 20260817_qwen35base_mvopsd_v1
title: "MV-OPSD v1：冻结 teacher + 评测进训练循环 + 每步样本溯源"
status: planned  # planned | running | completed | failed | cancelled

created_at: "2026-08-17T21:45:00+08:00"
finished_at: null
owner: "cursor-window-mvopsd"

goal: >
  v0 的训练本身跑完了 300 步且无异常，但它的所有 benchmark 数字都因评测协议缺陷作废
  （ISSUE-003 / LESSON-011），等于这轮训练没有产出任何可判读的结论。
  v1 要回答 v0 没能回答的问题：MV-OPSD 相对基座是提升还是损伤，损伤（若有）出现在第几步，
  以及曲线的变化能否归因到训练数据的构成而不是方法本身。

changes_vs_v0:
  - id: 评测进训练循环
    what: "CV-Bench 接进 verl 的 _validate()，val_before_train 给出 step 0 基座对照"
    why: "v0 训完 20 小时后才看到 benchmark 崩了，而 step 50 当时就足以叫停（LESSON-009）"
  - id: teacher 冻结
    what: "teacher_regularization 由 ema(0.05) 改为新增的 frozen，teacher 全程停在基座权重"
    why: >
      EMA teacher 会跟着 student 漂移，「student 匹配上了 teacher」因此不含任何正确性信息——
      v0 的 vopd_loss 收敛到 0.003 而回答退化成 170 词散文，两者并不矛盾。
      冻结后蒸馏目标是发布版 Qwen3.5-4B 的 N 视角后验，是这套设定里唯一不动的量。
    verification: >
      新增 self_distillation/teacher_probe 指标（teacher 首个参数分片前 64 个元素之和）。
      frozen 下逐步恒定，ema 下会漂移；这是「冻结」的结果级验收，不是配置级断言（LESSON-014）。
  - id: 每步样本溯源
    what: >
      rollout JSONL 增加 sample_id / source / subset / scene_id / k_views_student /
      n_views_teacher / privilege_bucket / view_selection / answer_view_sensitive / uid；
      wandb 增加 data/step/* 的批次构成指标与分数据源的 response_length。
    why: >
      用于事后追溯「表现变化是否来自训练数据源构成」。v0 只有全局均值，
      无法判断散文漂移是从某一个数据源开始扩散还是全局同时发生。
  - id: 评测频率
    what: "首轮用 test_freq=5（而非 10），用于快速确认训练+评测机制稳定"
    why: "机制刚改造完，前若干步的评测点密一些才能尽早发现链路问题"
hypothesis: >
  沿用 v0：低帧预算（1-4 帧）下的空间推理正确率会高于原始 Qwen3.5-4B。
  但在拿到 step 10 的 CV-Bench 之前，更需要先证伪的是「训练是否在破坏基座能力」——
  v0 的离线重测显示 step 50 = 76.50 而 step 300 = 72.19（Vision-OPD 官方协议），
  即分数随训练下降。若 v1 的曲线复现这个下降，应在 step 50 前后叫停而不是训满 300 步。

relations:
  supersedes: 20260816_qwen35base_mvopsd_v0
  inherits: >
    训练配置、数据 parquet、模型起点与 v0 完全一致，未重建任何数据。
    v0 产物与 registry 已于 2026-08-18 全部删除；历史结论见 LESSON-009/011/012。

