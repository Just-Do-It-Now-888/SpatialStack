issues:
  - id: ISSUE-103
    status: open  # 只要 v1 还在跑就一直成立
    phase: training
    discovered_at: "2026-08-18T03:05:00+08:00"
    symptom: >
      v1 若因任何原因中断后用同一条命令重启，不会恢复成同一个实验：
      `loss_agg_mode` 会在实验中途从 seq-mean-token-mean 变成 token-mean，
      `test_freq` 从 5 变成 15，`save_freq` 从 50 变成 15。曲线会在 step 50 处
      出现接缝，而日志与 wandb 都不会给出任何告警。
    evidence: >
      v1 训练进程启动于 2026-08-17 22:01:29（`ps -o lstart`，训练日志
      train_20260817_220130.log 的 config dump 即此刻打印）；
      mvopsd.yaml 的 mtime 是 2026-08-18 01:26:11，比启动晚 3 小时 25 分，
      未提交 diff 含 `loss_agg_mode: seq-mean-token-mean → token-mean`、
      `test_freq: -1 → 15`、`save_freq: 50 → 15`。
      同时 `trainer.resume_mode=auto` 且 checkpoints/20260817_qwen35base_mvopsd_v1_main/
      已存在 global_step_50，auto 会直接从它续训。
    root_cause: >
      为准备 rollout8 而修改了 v1 正在使用的同一份 mvopsd.yaml。运行中的进程
      在启动时就把配置读入内存，改文件不影响它，于是「磁盘上的配置」与
      「实际在跑的配置」分叉；而 resume_mode=auto 会让重启同时捡起旧 checkpoint
      和新配置，把两者拼在一起。
      与 ISSUE-101 是同一类问题的另一面：那次是实验名共享导致误续 checkpoint，
      这次是配置文件共享导致续跑时静默换参。
    solution: >
      v1 中断后**不得**直接重跑 `TEST_FREQ=5 EXPERIMENT_NAME=... run_mvopsd.sh main`。
      必须显式覆盖回本次运行的实际取值：
        TEST_FREQ=5 SAVE_FREQ=50 EXPERIMENT_NAME=20260817_qwen35base_mvopsd_v1_main \
          scripts/opsd/run_mvopsd.sh main \
          actor_rollout_ref.actor.loss_agg_mode=seq-mean-token-mean
      重启后应核对新日志开头的 config dump 与本 registry 的 parameters 一致，
      再确认 wandb 曲线在接缝处没有台阶。
    prevention: >
      为新实验改配置时，先确认没有正在运行的实验依赖同一份文件；
      若有，改动应通过启动命令的 CLI 覆盖或独立 config 文件表达，而不是原地改共享 yaml。
      另外：判断一个 run 用了什么参数，唯一可信来源是它自己训练日志开头的 config dump，
      不是当前磁盘上的 yaml。
  - id: ISSUE-101
    status: resolved
    phase: training
    discovered_at: "2026-08-17T21:40:00+08:00"
    symptom: >
      按默认 EXPERIMENT_NAME 启动会静默从 v0 的 global_step_300 续训，
      而不是从基座 Qwen3.5-4B 冷启动。
    evidence: >
      checkpoints/20260816_qwen35base_mvopsd_v0_main/ 下存在 global_step_50..300，
      latest_checkpointed_iteration.txt 内容为 300；正式训练走 resume_mode=auto
      （只有 SMOKE=1 才追加 resume_mode=disable）；
      run_mvopsd.sh 的默认 EXPERIMENT_NAME 正是 20260816_qwen35base_mvopsd_v0_main。
    root_cause: >
      v0 与 v1 共用同一个实验名，而 verl 的 auto 恢复只看目录里有没有 checkpoint。
      这正是 LESSON-006 描述的情形，v0 结束后目录未清理。
    solution: >
      v1 用独立实验名 20260817_qwen35base_mvopsd_v1_main，checkpoint / rollout /
      val dump / wandb run 全部落到新目录，v0 产物原样保留。
    prevention: >
      重跑同一设置时先确认 checkpoints/<experiment_name> 是否为空；
      不复用已完成实验的名字，除非确实要续训。

