
dataset_path: nyu-visionx/VSI-Bench
dataset_kwargs:
  token: False
  cache_dir: vsibench
  video: True
task: vsibench
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs
doc_to_visual: !function utils.vsibench_doc_to_visual
doc_to_text: !function utils.vsibench_doc_to_text
doc_to_target: "ground_truth"
# Answer budget, boxed last-line prompt and boxed-primary parser move together,
# selected by VSIBENCH_PROTOCOL (default "spatialstack" matches
# vsibench_val_boxed_lastline.parquet; "lastline" is SPAR wording without
# \\boxed{}; "spatialstack_plain" is the unsuffixed 2026-08-20 prompt; set
# "lmms_legacy" for upstream's 16-token protocol). Kept in utils.py rather
# than spelled out here so no run can pair one protocol's budget with the
# other's parser.
generation_kwargs: !function utils.VSIBENCH_GENERATION_KWARGS
# The return value of process_results will be used by metrics
process_results: !function utils.vsibench_process_results
# Note that the metric name can be either a registed metric function (such as the case for GQA) or a key name returned by process_results
metric_list:
  - metric: vsibench_score
    aggregation: !function utils.vsibench_aggregate_results
    higher_is_better: true
  - metric: vsibench_answered
    aggregation: !function utils.vsibench_aggregate_answered
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    mca_post_prompt: "Answer with the option's letter from the given choices directly."
    na_post_prompt: "Please answer the question using a single word or phrase."
  gemini_api:
    pre_prompt: ""
    mca_post_prompt: "Answer with the option's letter from the given choices directly."
    na_post_prompt: "Do not response anything other than a single number!"
  gpt4v:
    pre_prompt: ""
    mca_post_prompt: "Answer with the option's letter from the given choices directly."
    na_post_prompt: "Do not response anything other than a single number!"
metadata:
  - version: 0.0
